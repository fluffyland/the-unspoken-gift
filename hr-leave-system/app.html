<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaveDesk — Leave Management</title>
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --line:#dfe4ea; --ink:#1c2530; --muted:#5d6a79;
  --accent:#0c6b60; --accent-ink:#ffffff; --accent-soft:#e2f0ed; --accent-line:#b8dcd5;
  --good:#1a7a4a; --good-soft:#e2f2e8;
  --warn:#96590e; --warn-soft:#fcefd9;
  --bad:#b23a31; --bad-soft:#fbe6e4;
  --info:#6a4da3; --info-soft:#eee8f8;
  --gray-soft:#e9edf2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161d; --surface:#1a222c; --line:#2b3644; --ink:#e7edf3; --muted:#95a2b2;
    --accent:#37a08f; --accent-ink:#08211d; --accent-soft:#15352f; --accent-line:#26584f;
    --good:#4cbf82; --good-soft:#173226;
    --warn:#e0a34e; --warn-soft:#38290f;
    --bad:#e57a70; --bad-soft:#3a1c19;
    --info:#ab90e0; --info-soft:#291f3d;
    --gray-soft:#232d39;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"]{
  --bg:#f2f4f7; --surface:#ffffff; --line:#dfe4ea; --ink:#1c2530; --muted:#5d6a79;
  --accent:#0c6b60; --accent-ink:#ffffff; --accent-soft:#e2f0ed; --accent-line:#b8dcd5;
  --good:#1a7a4a; --good-soft:#e2f2e8; --warn:#96590e; --warn-soft:#fcefd9;
  --bad:#b23a31; --bad-soft:#fbe6e4; --info:#6a4da3; --info-soft:#eee8f8;
  --gray-soft:#e9edf2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#1a222c; --line:#2b3644; --ink:#e7edf3; --muted:#95a2b2;
  --accent:#37a08f; --accent-ink:#08211d; --accent-soft:#15352f; --accent-line:#26584f;
  --good:#4cbf82; --good-soft:#173226; --warn:#e0a34e; --warn-soft:#38290f;
  --bad:#e57a70; --bad-soft:#3a1c19; --info:#ab90e0; --info-soft:#291f3d;
  --gray-soft:#232d39;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%;
}
select{padding-right:28px;text-overflow:ellipsis} /* keep long option text clear of the dropdown arrow */
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:17px;letter-spacing:.2px}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.iconbtn{background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;position:relative}
.iconbtn:hover{background:var(--gray-soft);color:var(--ink)}
.nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:2px;overflow-x:auto}
.nav button{background:transparent;color:var(--muted);padding:11px 14px;border-radius:0;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav button:hover{color:var(--ink)}
.nav .cnt{display:inline-block;min-width:18px;text-align:center;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 5px;margin-left:6px;line-height:17px}

main{padding:22px 0 60px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}

.balgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.bal .t{font-size:13px;font-weight:600}
.bal .en{font-size:11px;color:var(--muted);letter-spacing:.04em}
.bal .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 0;color:var(--accent)}
.bal .n small{font-size:13px;color:var(--muted);font-weight:500}
.bal .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.st-approved{background:var(--good-soft);color:var(--good)}
.st-rejected{background:var(--bad-soft);color:var(--bad)}
.st-returned{background:var(--warn-soft);color:var(--warn)}
.st-withdrawn{background:var(--gray-soft);color:var(--muted)}
.st-cancel_requested{background:var(--info-soft);color:var(--info)}
.st-cancelled{background:var(--gray-soft);color:var(--muted)}

.tablebox{overflow-x:auto}
.tablebox table.nowrap td,.tablebox table.nowrap th{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px;letter-spacing:.03em}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
/* Set-every-row checkbox inside a column header (dash = rows are mixed) */
.coltoggle{display:flex;justify-content:center;margin-top:6px}
.coltoggle input{cursor:pointer;transform:scale(1.15);transform-origin:center}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--gray-soft)}
td.num{font-variant-numeric:tabular-nums}

.btn{background:var(--accent);color:var(--accent-ink);padding:9px 18px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--gray-soft);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.req{color:#e5484d;font-weight:700;margin-left:2px}
/* The four account types, explained under the picker. The selected one is marked with a
   left rule rather than a colour alone, so it survives a mono screen and a colour-blind
   reader. */
.roledesc{margin:8px 0 2px;font-size:12.5px;line-height:1.5}
.roledesc>div{display:flex;gap:10px;padding:5px 9px;border-left:3px solid transparent;border-radius:0 6px 6px 0}
.roledesc>div>b{flex:0 0 132px;color:var(--muted);font-weight:600}
.roledesc>div>span{flex:1;color:var(--muted)}
.roledesc>div.on{border-left-color:var(--accent);background:var(--accent-soft)}
.roledesc>div.on>b,.roledesc>div.on>span{color:var(--ink)}
@media(max-width:560px){.roledesc>div{flex-direction:column;gap:2px}.roledesc>div>b{flex:none}}
.frow{display:flex;gap:14px;flex-wrap:wrap}
.frow .field{flex:1;min-width:160px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:16px;height:16px}
.hdlist{display:flex;flex-direction:column;gap:6px}
.hdrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gray-soft);border-radius:8px;padding:6px 10px;font-size:13.5px}
.hdrow select{max-width:190px;padding:5px 8px}

.callout{border-radius:var(--r);padding:12px 16px;font-size:13.5px;border:1px solid}
.callout.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}

.appcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.appcard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.appcard .hd b{font-size:15.5px}
.typechip{background:var(--gray-soft);border-radius:6px;padding:2px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.appcard .when{font-size:15px;margin:2px 0;font-variant-numeric:tabular-nums}
.appcard .why{font-size:13.5px;margin:0 0 2px;overflow-wrap:anywhere}
.hchip{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;margin:1px 4px 1px 0;background:var(--bg);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:13.5px}
.step{display:flex;align-items:center;gap:8px}
.step .dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.ok .dot{background:var(--good-soft);color:var(--good)}
.step.now .dot{background:var(--warn-soft);color:var(--warn)}
.step.off .dot{background:var(--gray-soft);color:var(--muted)}
.step.no .dot{background:var(--bad-soft);color:var(--bad)}

.timeline{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.timeline li{padding:6px 0 6px 18px;border-left:2px solid var(--line);position:relative}
.timeline li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .tm{color:var(--muted);font-size:12px}

.phsearch{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--surface);font-size:13px;font-weight:400}
.phsearch input{border:0;padding:0;width:52px;font:inherit;font-weight:600;background:transparent;text-align:center}
.phsearch input:focus{outline:none}
.modalback{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);max-width:620px;width:100%;padding:22px}
.modal .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .hd h3{flex:1;margin:0;font-size:17px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--gray-soft);color:var(--muted);padding:7px 14px;font-weight:600;font-size:13px;border-radius:99px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px}
.loginbox{max-width:390px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px}
.loginbox h1{font-size:26px;margin:0 0 4px;letter-spacing:.2px}
.loginbox .tag{color:var(--muted);margin:0 0 22px;font-size:14px}
.footnote{color:var(--muted);font-size:12.5px;margin-top:20px;line-height:1.7}


#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.calhead h3{margin:0;font-size:16px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.calbox{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:700px}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.05em;padding:4px 0}
.cal .day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:78px;padding:4px 5px;font-size:12px}
.cal .day.off{background:var(--gray-soft);border-color:transparent}
.cal .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .dnum{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.cal .dnum .ph{color:var(--warn);font-weight:600;font-size:10.5px}
.cal .phname{color:var(--warn);font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper input{border:0;width:56px;text-align:center;font-weight:600;background:transparent;padding:7px 4px}
.stepper input:focus{outline:none}
.steps{display:flex;flex-direction:column;border-left:1px solid var(--line)}
.stepbtn{border:0;background:var(--surface);color:var(--muted);cursor:pointer;font-size:9px;line-height:1;padding:0 7px;flex:1}
.stepbtn:hover{background:var(--line);color:var(--fg)}
.stepbtn+.stepbtn{border-top:1px solid var(--line)}
.offset{display:flex;flex-direction:column;gap:2px;min-width:190px}
.offrow{display:flex;justify-content:space-between;gap:14px;font-size:13px}
.offrow.tot{border-top:1px solid var(--line);margin-top:3px;padding-top:3px}
.dangerzone{border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-top:14px;background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.dangerzone h4{margin:0 0 4px;color:var(--bad);font-size:13px}
.dangerzone p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.cal .chips{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.lvchip{border-radius:5px;padding:1px 5px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvchip.ap{background:var(--accent);color:var(--accent-ink)}
.lvchip.pd{background:var(--gray-soft);color:var(--muted);opacity:.65;border:1px dashed var(--line)}
.legend{display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.ackbox{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;margin-top:10px}
.ackbox input{width:16px;height:16px;margin-top:3px;flex:none}
.conflictlist{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.conflictlist li{display:grid;grid-template-columns:minmax(64px,max-content) 1fr auto;gap:10px;align-items:center;padding:3px 0}
.conflictlist .cldate{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:26px 0;text-align:center}

/* Phone layout: tighter cards, full-width tap targets */
@media (max-width:560px){
  .wrap{padding:0 10px}
  input,select,textarea{font-size:16px}  /* iOS Safari: fields <16px auto-zoom on focus; 16px stops the login-page zoom */
  /* Header: let it wrap to two tidy rows instead of a fixed row that overflows */
  .topbar .wrap{height:auto;min-height:56px;flex-wrap:wrap;gap:6px 8px;padding-top:8px;padding-bottom:8px}
  .logo{flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
  .spacer{display:none}
  .userchip{flex:1;min-width:0;font-size:12px}
  .iconbtn{padding:6px 8px}
  .iconbtn .lbl{display:none}   /* 🔑 Password → just 🔑 on phones */
  .appcard{padding:12px}
  .appcard .actions .btn{flex:1;padding:10px 6px;text-align:center}
  .callout{padding:10px}
  .kv{grid-template-columns:1fr;gap:1px 0}
  .kv dt{margin-top:6px}
  .conflictlist li{grid-template-columns:minmax(56px,max-content) 1fr auto;gap:7px}
  .modal{padding:14px}
}
</style>
</head>

<script>
"use strict";
/* ============ Production build — talks to Supabase (real login + database) ============ */
const SUPABASE_URL = "https://aypyolzkdupkpefpxius.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cHlvbHprZHVwa3BlZnB4aXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MDM0MTMsImV4cCI6MjA5OTA3OTQxM30.hoRS_j8yBTJkcQBG_IZRuVgDD06ZGCRam8lqz923f6s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* db is an in-memory cache hydrated from Supabase; renderers read from it unchanged. */
let db, me = null, view = "dashboard", vp = {}, hrTab = "records";

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => iso(new Date());
const dstr = off => { const d = new Date(); d.setDate(d.getDate() + off); return iso(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Human dates: "20 Jul" (year only when it differs from the current year) */
const fmtDate = s => { const [y, m, d] = String(s).split("-").map(Number); return d + " " + MON[m - 1] + (y !== new Date().getFullYear() ? " " + y : ""); };
const fmtDMY = s => { if (!s) return "—"; const [y, m, d] = String(s).split("-"); return (d && m && y) ? `${d}/${m}/${y}` : s; };  // Day/Month/Year
// Parse a typed "DD/MM/YYYY" (also accepts - or . separators, 2-digit year) into ISO "yyyy-mm-dd"; "" if invalid.
/* Singapore gazettes 11 public holidays a year, so fewer than 11 rows for a year means
   the year is incomplete, not merely unusual. Only nags from September: MOM publishes the
   following year around April, and a warning that shows all year teaches people to ignore
   warnings. Returns "" when there is nothing to say. */
function phMissingYear(now) {
  if (!db || !db.publicHolidays) return "";
  const d = now || new Date();
  if (d.getMonth() < 8) return "";                      // Jan–Aug: too early to nag
  const nextY = String(d.getFullYear() + 1);
  const n = db.publicHolidays.filter(p => p.startsWith(nextY)).length;
  return n < 11 ? nextY : "";
}

/* Read a pasted list of public holidays.

   MOM's own page is a table — Date | Day | Holiday — and copying it gives tab-separated
   cells, a header row, dates whose Day and Holiday cells land on a LATER line (that is how
   Chinese New Year's two days come out), and a footnote sentence about in-lieu days.
   Reading one line at a time could not cope with any of that: a bare "6 February 2027"
   was unreadable, and "1 January 2027" ended up named "Friday New Year New Year's Day".

   So this walks the CELLS in order and reads the table the way a person does:
     · a date        → opens a row that is waiting for a name
     · a weekday     → the Day column; dropped
     · anything else → the name for the OLDEST row that hasn't got one
   A name arriving with no row waiting is kept only if it is a longer form of the name just
   assigned ("New Year" → "New Year's Day"); that is what collapses MOM's duplicated
   Holiday columns, and it is why the header row disappears instead of becoming a name.

   Nothing is guessed. A line that contributes nothing comes back in `bad`, and a date left
   without a name comes back in `noName`, so both are shown rather than silently dropped —
   a bulk importer that eats a line is worse than one that refuses.

   Returns { add, dup, bad, noName }. It writes nothing; the caller confirms first. */
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const WEEKDAYS = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
// How far the public-holiday year navigation reaches. Deliberately not shown to anyone:
// a limit you have to think about is a limit set too low.
const PH_MIN = 2000, PH_MAX = 2500;
// Column headings and the like. Not names, and not errors either.
const PH_NOISE = ["date","dates","day","days","holiday","holidays","public holiday","public holidays","observance","note","notes"];
// MOM's footnote: "Monday, 8 February 2027, will be a public holiday if your rest day
// falls on 7 February 2027." That Monday is conditional — it depends on the individual's
// rest day — so it is NOT gazetted for everyone and must never be added automatically.
const PH_FOOTNOTE = /will be a public holiday|rest day|in lieu|following monday/i;

function parseHolidayLines(text, existing) {
  const rows = [], dup = [], bad = [], pad = n => String(n).padStart(2, "0");
  const isReal = (y, mo, d) => {
    const dt = new Date(y, mo - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
  };
  // A date only when the WHOLE cell is one — so "8 February 2027" inside a sentence
  // can never be mistaken for a row of the table.
  const asDate = v => {
    const t = String(v || "").trim().replace(/[,.]$/, "");
    const m = t.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
    if (m) {
      const mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase()) + 1;
      return mo && isReal(+m[3], mo, +m[1]) ? `${m[3]}-${pad(mo)}-${pad(+m[1])}` : "";
    }
    const i = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (i) return isReal(+i[1], +i[2], +i[3]) ? `${i[1]}-${pad(+i[2])}-${pad(+i[3])}` : "";
    return dmyToIso(t);
  };
  const plain = v => String(v || "").trim().replace(/[,.]$/, "").toLowerCase();
  const isWeekday = v => WEEKDAYS.includes(plain(v));
  const isNoise = v => PH_NOISE.includes(plain(v));
  // One cell may still hold "01/01/2027 New Year's Day" when it was typed with a single
  // space rather than copied out of a table. Split those, and drop a leading weekday.
  const expand = cell => {
    const t = String(cell || "").trim();
    if (!t || asDate(t)) return t ? [t] : [];
    const m = t.match(/^(\d{1,2}\s+[A-Za-z]{3,}\s+\d{4}|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s*[\/.\-]\s*\d{1,2}\s*[\/.\-]\s*\d{2,4})\s+(.+)$/);
    if (m && asDate(m[1])) {
      const rest = m[2].trim().replace(/^(mon|tue|tues|wed|wednes|thu|thur|thurs|fri|sat|satur|sun)(day)?[,\s]+/i, "").trim();
      return rest ? [m[1], rest] : [m[1]];
    }
    return [t];
  };

  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (PH_FOOTNOTE.test(line)) continue;          // an explanatory sentence, not a row
    let used = false;
    for (const cell of line.split(/\t+|\s{2,}|\s*\|\s*/).flatMap(expand)) {
      const iso = asDate(cell);
      if (iso) { rows.push({ holiday: iso, name: "" }); used = true; continue; }
      if (isWeekday(cell) || isNoise(cell)) { used = true; continue; }
      const name = String(cell).trim();
      if (!name || name.length > 60) continue;     // prose, not a holiday name
      const waiting = rows.find(r => !r.name);
      if (waiting) { waiting.name = name; used = true; continue; }
      // No row waiting. MOM prints the holiday twice, the second time in full.
      const last = rows.length ? rows[rows.length - 1] : null;
      if (last && last.name && (name.startsWith(last.name) || last.name.startsWith(name))) {
        if (name.length > last.name.length) last.name = name;
        used = true;
      }
    }
    if (!used) bad.push(line);
  }

  const add = [], noName = [], seen = new Set();
  for (const r of rows) {
    if (!r.name) { noName.push(r.holiday); continue; }
    if ((existing || []).includes(r.holiday) || seen.has(r.holiday)) { dup.push(r.holiday); continue; }
    seen.add(r.holiday); add.push(r);
  }
  add.sort((a, b) => a.holiday < b.holiday ? -1 : 1);
  return { add, dup, bad, noName };
}

function dmyToIso(s) {
  const m = String(s || "").trim().match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})$/);
  if (!m) return "";
  let d = +m[1], mo = +m[2], y = +m[3];
  if (y < 100) y += 2000;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return "";  // rejects e.g. 31/02
  const p = n => String(n).padStart(2, "0");
  return `${y}-${p(mo)}-${p(d)}`;
}
/* "20 Jul" · "18–20 Jul" · "28 Jul – 2 Aug" */
const fmtRange = (s, e) => {
  if (!e || e === s) return fmtDate(s);
  const [ys, ms] = String(s).split("-").map(Number), [ye, me] = String(e).split("-").map(Number);
  if (ys === ye && ms === me) return Number(String(s).slice(8)) + "–" + fmtDate(e);
  return fmtDate(s) + " – " + fmtDate(e);
};
const fmtTs = ts => { const d = new Date(ts); return fmtDate(iso(d)) + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtD = n => (n % 1 === 0 ? n : n.toFixed(1));
// Like fmtDate but ALWAYS keeps the year. For deadlines, "30 Jun" of which year is the
// whole question — fmtDate drops the year exactly when it is the current one.
const fmtDateY = s => { const [y, m, d] = String(s).split("-").map(Number); return d + " " + MON[m - 1] + " " + y; };

/* ---- v24: the carry-forward expiry is a day + month that repeats every year ---- */
const MONFULL = ["January","February","March","April","May","June",
                 "July","August","September","October","November","December"];
// Days in a month, for a year that MIGHT be a leap year. The picker offers 29 for
// February all the time; carry_expiry_for() in SQL clamps to 28 in a non-leap year,
// so the setting can never produce a date that does not exist.
const daysInMon = (m, y) => m === 2 ? (y == null ? 29 : (new Date(y, 2, 0).getDate()))
                                    : [31,28,31,30,31,30,31,31,30,31,30,31][m - 1];
// The date carried days would have to be used by, for the year carry is created in.
function carryExpiryDate(mon, day, year) {
  if (!mon || !day) return null;
  const d = Math.min(day, daysInMon(mon, year));
  return year + "-" + String(mon).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

/* ============ Supabase → in-memory cache (renderers read db.* unchanged) ============ */
const mapEmp = r => ({ id: r.id, name: r.name, title: r.title || "", dept: r.dept || "", gender: r.gender,
  role: r.role, email: r.email, joinDate: r.join_date, approver1: r.approver1, approver2: r.approver2,
  empNo: r.emp_no || "", alias: r.alias || "", mobile: r.mobile || "", hasLogin: !!r.auth_user_id,
  twoLevel: r.two_level, annualBase: Number(r.annual_base), active: r.active, lastDay: r.last_working_day || null,
  worksSat: r.works_saturday,
  // Per employee on purpose: different staff carry different amounts. undefined until v16 runs.
  carryCap: (r.carry_cap == null ? null : Number(r.carry_cap)) });
const mapType = r => ({ code: r.code, en: r.name_en, zh: r.name_zh, mc: r.requires_attachment,
  gender: r.gender_eligibility, noDeduct: r.no_deduct, days: Number(r.default_days),
  allowHalf: r.allow_half_day, sort: r.sort, note: r.note || "" });
// Numeric-with-default that keeps a real 0 (unlike `Number(x) || d`); blank/invalid → default.
const numOr = (v, d) => { const n = Number(v); return (v === "" || v == null || !Number.isFinite(n)) ? d : n; };
// THE REVERSED TYPING. `<input type="number">` is not allowed to report a cursor position:
// reading selectionStart on one returns null (and throws in some browsers), so render()'s
// caret restore has nothing to put back and drops the cursor at character 0. Every box that
// re-renders as you type therefore built its number BACKWARDS — you type 15, you get 51.
// It was reported on the holiday paste box, fixed there for text inputs, and came straight
// back on the first number box added afterwards, because the cause was never the box.
//
// So any number box that re-renders while you type is a TEXT box with a numeric keypad
// instead — the same shape the Hire date field already uses. Boxes that only settle on
// blur can stay type="number"; they never re-render mid-word, so they never had this.
const NUMBOX = 'type="text" inputmode="decimal" autocomplete="off"';
// THE STRIPPED MINUS. numText() exists to keep a text box numeric, and it threw away the
// leading "-" on every field — including the two that are meant to take one. Off-in-lieu
// typed as -30 was staged as 30, and because staging happens without redrawing, the box
// still read -30 until something else redrew the page: answering "Required to work on
// Saturday" did, and 30 appeared. Days entitled and the carry-forward cap still refuse a
// minus; these two do not.
const NEG_OK = new Set(["em.oilDays", "led.delta", "albump"]);
const allowsNeg = el => NEG_OK.has(el.dataset.f || "");
const isNumBox = el => el.type === "number" || el.inputMode === "decimal";
// Keep only what can be part of a number, so a text box cannot hold "abc". One leading
// minus (balance adjustments take -2) and one decimal point.
function numText(v, allowNeg) {
  let s = String(v == null ? "" : v).replace(allowNeg ? /[^0-9.\-+]/g : /[^0-9.]/g, "");
  // A leading + is kept where a minus is allowed, so the box can show its own sign.
  if (allowNeg) { const sign = s[0] === "-" ? "-" : s[0] === "+" ? "+" : ""; s = sign + s.replace(/[-+]/g, ""); }
  const i = s.indexOf(".");
  if (i !== -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, "");
  return s;
}
/* DB action codes → display strings the history/timeline renderers expect */
const mapAction = c => ({
  submitted: "Submitted", resubmitted: "Resubmitted",
  step_approved: "Approved (a level)", step_approved_overlap_ack: "Approved (overlap acknowledged)",
  approved: "Approved", approved_overlap_ack: "Approved (overlap acknowledged)",
  rejected: "Rejected", returned: "Returned", withdrawn: "Withdrawn", auto_approved: "Auto-approved",
  cancel_requested: "Cancellation requested", cancelled: "Cancellation confirmed", cancel_denied: "Cancellation declined",
  auto_cancelled: "Cancelled automatically"
}[c] || c);

async function loadAll() {
  // 按需知：HR 读整表（含 annual_base/join_date 等敏感列供 Console 编辑）；
  // 其余人只读目录视图（姓名/部门/职位/审批链等非敏感列）。
  // 目录视图未部署时（migration 尚未执行）自动回退到整表，令前后端部署顺序无关。
  const isHR = me && (me.role === "hr" || me.role === "admin");
  const rosterP = (async () => {
    if (isHR) return sb.from("employees").select("*");
    const r = await sb.from("employees_directory").select("*");
    return r.error ? sb.from("employees").select("*") : r;
  })();
  // `source` column only exists after the v7 migration — fall back to holiday,name
  // when it isn't there yet, so login/loadAll never breaks pre-migration.
  const phP = (async () => {
    const r = await sb.from("public_holidays").select("*");
    return r.error ? sb.from("public_holidays").select("holiday,name") : r;
  })();
  const [empR, typeR, phR, deptR, orgR] = await Promise.all([
    rosterP,
    sb.from("leave_types").select("*"),
    phP,
    sb.from("departments").select("*"),
    sb.from("org_settings").select("*").maybeSingle()
  ]);
  const firstErr = [empR, typeR, phR, deptR, orgR].map(r => r.error).find(Boolean);
  if (firstErr) throw firstErr;

  const employees = (empR.data || []).map(mapEmp).sort((a, b) => a.name.localeCompare(b.name));
  const leaveTypes = (typeR.data || []).map(mapType).sort((a, b) => a.sort - b.sort);
  const publicHolidays = (phR.data || []).map(x => x.holiday).sort();
  const phNames = Object.fromEntries((phR.data || []).map(x => [x.holiday, x.name || "Public holiday"]));
  const departments = (deptR.data || []).map(x => x.name).sort((a, b) => a.localeCompare(b));
  // Public holidays are a list HR keeps by hand. The automatic MOM sync was removed in
  // Aug 2026 — it had never once run against this project, and a button that looks
  // automatic while doing nothing is worse than no button. The `source` / `synced_at` /
  // `updated_at` columns and the holiday_sync_log table still exist in the database;
  // nothing reads them any more. See HANDOVER.md before wiring any of it back up.
  // Keep `departments` a plain list of names — dropdowns everywhere depend on that.
  // The Saturday flag rides alongside as a lookup instead of changing the shape.
  const deptSat = Object.fromEntries((deptR.data || []).map(x => [x.name, !!x.works_saturday]));
  const o = orgR.data || {};
  const org = { company: o.company_name || "", emailDomain: o.email_domain || "", country: o.country || "",
    defaultAnnualBase: Number.isFinite(Number(o.default_annual_base)) ? Number(o.default_annual_base) : 14,
    prorateCap: (o.prorate_cap == null ? null : Number(o.prorate_cap)),
    annualCap:  (o.annual_cap  == null ? null : Number(o.annual_cap)),
    accrualMode: o.accrual_mode || "annual",
    defaultCarryCap: (o.default_carry_cap == null ? null : Number(o.default_carry_cap)),
    carryExpiryMonths: (o.carry_expiry_months == null ? null : Number(o.carry_expiry_months)),
    // v24: the expiry is a day + month that repeats every year. Both null = never expires.
    carryExpiryMonth: (o.carry_expiry_month == null ? null : Number(o.carry_expiry_month)),
    carryExpiryDay:   (o.carry_expiry_day   == null ? null : Number(o.carry_expiry_day)) };

  const [appR, ledR] = await Promise.all([
    sb.from("applications").select("*").order("created_at", { ascending: false }),
    sb.from("leave_ledger").select("*")
  ]);
  if (appR.error) throw appR.error;
  const apps = appR.data || [], appIds = apps.map(a => a.id);
  let steps = [], events = [];
  if (appIds.length) {
    const [sR, eR] = await Promise.all([
      sb.from("approval_steps").select("*").in("application_id", appIds),
      sb.from("application_events").select("*").in("application_id", appIds)
    ]);
    steps = sR.data || []; events = eR.data || [];
  }
  const applications = apps.map(a => ({
    id: a.id, empId: a.emp_id, type: a.leave_type, start: a.start_date, end: a.end_date,
    sh: a.start_half, eh: a.end_half, halfDays: Array.isArray(a.half_days) ? a.half_days : [], days: Number(a.days), reason: a.reason, att: a.attachment_path || "",
    status: a.status, cur: Math.max(0, (a.current_step || 1) - 1), backdated: a.backdated,
    createdAt: Date.parse(a.created_at),
    steps: steps.filter(s => s.application_id === a.id).sort((x, y) => x.step_order - y.step_order)
      .map(s => ({ order: s.step_order, approverId: s.approver_id, status: s.status, comment: s.comment || "", ts: s.acted_at ? Date.parse(s.acted_at) : null }))
  }));
  const ledger = (ledR.data || []).map(l => ({ id: l.id, empId: l.emp_id, type: l.leave_type,
    delta: Number(l.delta_days), reason: l.reason, refApp: l.ref_application, by: l.created_by, ts: Date.parse(l.created_at) }));
  // The timeline prints "<action> — <comment>", and the database writes a fixed sentence
  // for the two automatic actions, so the explanation landed twice and named a job title
  // ("Managing Director") that is only right for one person. Normalise it here rather than
  // with a migration, so rows already written are corrected too.
  const autoComment = c => /^No approver required/i.test(c || "") ? "No approver required" : (c || "");
  const ev = events.map(v => ({ appId: v.application_id, actor: v.actor, action: mapAction(v.action),
    comment: autoComment(v.comment), ts: Date.parse(v.created_at) })).sort((a, b) => a.ts - b.ts);

  // Company-wide calendar comes from a dedicated view (everyone can read it),
  // separate from `applications` which RLS limits to your own + those you approve.
  const calR = await sb.from("leave_calendar").select("*");
  const calendar = (calR.data || []).map(c => ({ name: c.name, dept: c.dept, start: c.start_date, end: c.end_date, status: c.status, worksSat: !!c.works_saturday }));

  db = { org, departments, deptSat, employees, leaveTypes, publicHolidays, phNames, ledger, applications, events: ev, calendar, outbox: [], balCache: {} };
  // Feature detection so the UI stays safe before the v8 database migration is applied.
  db.empExtra   = !!(empR.data && empR.data[0] && ("emp_no" in empR.data[0]));
  db.ltHalf     = !!(typeR.data && typeR.data[0] && ("allow_half_day" in typeR.data[0]));
  // v12 adds works_saturday to departments/employees. Until the migration is run,
  // hide the controls and omit the field rather than failing every save.
  db.hasSat     = !!(deptR.data && deptR.data[0] && ("works_saturday" in deptR.data[0]));
  // v13 adds public_holidays.updated_at. Sending it before the migration has run would
  // fail every manual holiday add/edit, so gate the writes on it being present.
  db.hasPhWhen  = !!(phR.data && phR.data[0] && ("updated_at" in phR.data[0]));
  db.orgProrate = !!(orgR.data && ("prorate_cap" in orgR.data));
  // v14: cap on long-service growth, and monthly vs one-shot crediting
  db.orgV14     = !!(orgR.data && ("accrual_mode" in orgR.data));
  // v16: per-employee carry cap, configurable expiry, yearly resets, the year-start log.
  db.orgV16     = !!(orgR.data && ("carry_expiry_months" in orgR.data));
  db.orgV24     = !!(orgR.data && ("carry_expiry_day" in orgR.data));

  // In-app notices (public-holiday updates etc.) + this year's carried-over annual leave.
  // Views may not exist until the v7 migration runs — degrade gracefully to none.
  const [annR2, carryR2, amdR, allCarryR] = await Promise.all([
    sb.from("my_announcements").select("*").eq("read", false).order("created_at", { ascending: false }),
    sb.from("my_annual_carry").select("*").maybeSingle(),
    // The second record book. HR only (RLS), and absent until v18 runs — which is also
    // how the app knows whether v18 is there at all.
    isHR ? sb.from("hr_amendments").select("*").order("at", { ascending: false }).limit(500)
         : Promise.resolve({ data: [], error: null }),
    // HR can read the whole carry table (RLS: `emp_id = current_emp_id() or is_hr()`),
    // which is what lets the Balances tab show a CF column for everyone rather than
    // just for whoever is looking at it.
    isHR ? sb.from("annual_carry").select("emp_id,year,carry_in,expired_at")
         : Promise.resolve({ data: [], error: null })
  ]);
  db.announcements = annR2.error ? [] : (annR2.data || []);
  db.annualCarry = (carryR2 && !carryR2.error) ? carryR2.data : null;
  db.amendments = (amdR && !amdR.error) ? (amdR.data || []) : [];
  db.allCarry = (allCarryR && !allCarryR.error) ? (allCarryR.data || []) : [];
  // v18: entitlement typed directly, leave-type days crediting the difference, HR applying
  // on behalf, and the amendment record. Detected from the record table it adds — but only
  // HR ever reads that table, so non-HR falls back to the column v18 leaves on employees.
  // Every screen this flag gates is HR-only (Leave types, Edit employee, Amendment
  // records), so for everyone else it simply never matters.
  db.orgV18 = isHR ? !!(amdR && !amdR.error) : db.orgV16;

  // Approvers (non-HR) can't read applicants' ledger under RLS; fetch just the
  // available-days number for each application in their inbox via a definer RPC.
  if (me && me.role !== "hr" && me.role !== "admin") {
    const need = applications.filter(a => a.empId !== me.id &&
      (["pending", "cancel_requested"].includes(a.status)) && a.steps.some(s => s.approverId === me.id));
    await Promise.all(need.map(async a => {
      const { data } = await sb.rpc("leave_available", { p_emp: a.empId, p_code: a.type });
      if (data != null) db.balCache[a.empId + "|" + a.type] = Number(data);
    }));
  }
}

/* Working-day count (excludes weekends + SG public holidays; supports half days) */
/* Mirrors SQL emp_works_saturday(): personal override wins, else the department
   default, else no. `null` means "inherit" and must stay distinct from `false`. */
function empWorksSat(e) {
  if (!e) return false;
  if (e.worksSat === true || e.worksSat === false) return e.worksSat;
  return !!((db.deptSat || {})[e.dept]);
}
/* Frontend mirror of the SQL authority is_working_day(emp, date). Keep the two in
   step: Sunday never counts, Saturday only for Saturday workers, a public holiday
   never counts for anyone. Do NOT re-derive this rule anywhere else — three
   divergent copies are what put weekends on the calendar as leave. */
function isWorkingDayFor(ds, worksSat) {
  if (db.publicHolidays.includes(ds)) return false;
  const d = new Date(ds + "T00:00:00").getDay();   // 0 = Sun … 6 = Sat
  if (d === 0) return false;
  if (d === 6) return !!worksSat;
  return true;
}
/* Does this draft clash with the applicant's own existing leave? Used BOTH while the
   dates are being picked (so the warning is immediate) and again at submit. The
   database enforces it independently — this is UX, not the guard. */
function selfOverlap(f, exceptId) {
  return db.applications.find(a => a.empId === me.id && a.id !== exceptId &&
    ["pending", "approved", "cancel_requested"].includes(a.status) &&
    !(f.end < a.start || f.start > a.end));
}
function workingDaysList(start, end, forEmp) {
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  const list = [];
  if (!(s <= e)) return list;
  // Defer to the one mirror of the SQL rule rather than re-testing weekends here —
  // this function having its own copy is how the calendar drifted out of step.
  const sat = empWorksSat(forEmp || me);
  for (const d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
    if (isWorkingDayFor(iso(d), sat)) list.push(iso(d));
  }
  return list;
}
/* Day count honouring a per-day half map { "YYYY-MM-DD": "am"|"pm" } */
function wdCountHalf(start, end, half) {
  const list = workingDaysList(start, end);
  let n = list.length;
  for (const ds of list) if (half && (half[ds] === "am" || half[ds] === "pm")) n -= 0.5;
  if (n <= 0 && list.length) n = 0.5;
  return n;
}
/* Legacy sh/eh records only — a per-day half map gets its own table row (halfDayRows).

function halfSummary(a) {
  if ((a.halfDays || []).length) return "";
  if (a.sh || a.eh) return (a.sh ? " · first day ½" : "") + (a.eh ? " · last day ½" : "");
  return "";
}
/* Half-days, one per line, with the weekday — an approver checking a pattern of

function halfDayRows(a) {
  const hd = (a.halfDays || []).slice().sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  if (!hd.length) return "";

   never came down (17 stayed 17 after the change) and "Taken" was inflated by the same
   amount. Reported as "-2 / 17" and "SL changed from 17 to 14 but still shows 17".

  if (!canSeeLedger(empId) && key in db.balCache) return { granted: null, used: null, pending: 0, avail: db.balCache[key], limited: true };
  let granted = 0, used = 0, yGranted = 0, yUsed = 0;
  // yGranted / yUsed are THIS YEAR's. They used to be all-time sums while every label said
  // "this year" — that was 19 / 22, and 972 / 528 after a few years.
  const y = String(new Date().getFullYear());
  for (const l of db.ledger) if (l.empId === empId && l.type === code) {

function conflictGroup(empId) {

  // We deliberately do NOT group by "same approver1": at the top of the org

// Editing a field in the HR Console re-renders the whole page. Without this the

  // "fixed" twice, because the test measured window.scrollY, which never moves in

function chainText(e) {
  if (!e.approver1) return "Auto-approved — No approver required";
  let s = emp(e.approver1) ? empName(e.approver1) : "—";
  if (e.twoLevel && e.approver2) s += " → " + empName(e.approver2) + " (2 levels)";
  return s;
}
/* Carried-forward annual leave shown as its OWN category, never folded into Annual Leave —
   the two are different money: carried days can expire, this year's cannot. It stays on
   screen at zero rather than vanishing, so the figure is always answerable. */
function carryLine(code, b) {
  // Shown for annual leave ALWAYS — including 0, and including when no carry-over record
  // exists at all. It used to vanish entirely in that case, so there was no way to tell
  // "you have none" from "this app has no such thing".
  if (code !== "annual" || !db.orgV16) return "";
  const avail = Number(b.avail) || 0;
  const c = Math.max(0, Number((db.annualCarry || {}).remaining) || 0);
  const usable = Math.max(0, Math.min(c, avail));   // carry you can still actually book
  const own = avail - usable;                        // the two always sum to Available
  const exp = (db.annualCarry || {}).expires_on ? fmtDateY(db.annualCarry.expires_on) : "N/A";
  return `Annual Leave: ${fmtD(own)} · Carry Forward: ${fmtD(usable)} (Expiry Date: ${exp}) · `;
}
/* ---- Start a new year: preview, result, and the permanent log --------------------
   The preview and the run are the SAME database function called with preview=true/false,
   so what you were shown and what was recorded cannot disagree — that is a property of
   the code, not something two implementations have to be kept agreeing on. */
function fmtDays(n) { return fmtD(Number(n) || 0); }
const nPeople = n => (Number(n) || 0) + ((Number(n) || 0) === 1 ? " person" : " people");

}

/* ---- Apply ---- */
/* Who the Apply form is FOR. Normally the person using it; when HR is applying on
   somebody's behalf, that employee. Introduced so the HR form is the SAME form — the
   working-day counting, the balance line, the half-day rules and the MC rule all come
   from one renderer, and a change to any of them reaches both places at once. */
function applySubject() { return (vp.forEmp && emp(vp.forEmp)) || me; }
// WHERE THE APPLY FORM IS ON SCREEN. HR entering leave for someone runs the SAME renderer,
// but at view "hr" / hrTab "apply" — while every field handler was written as
// `view === "apply"`. So on HR's copy nothing was ever recorded: picking a date left the
// old one, and so did the leave type, the half-days, the attachment and the remarks.
// One helper, used by both listeners, so a form cannot be drawn somewhere its own fields
// are dead.
function onApplyView() { return view === "apply" || (view === "hr" && hrTab === "apply"); }
function vApply() {
  const who = applySubject(), onBehalf = !!vp.hrApply;
  const editing = vp.editId ? db.applications.find(a => a.id === vp.editId) : null;
  const types = db.leaveTypes.filter(t => eligible(t, who)).sort((a, b) => a.sort - b.sort);
  const f = vp.form || (editing
    ? { type: editing.type, start: editing.start, end: editing.end, half: Object.fromEntries((editing.halfDays || []).map(x => [x.d, x.part])), reason: editing.reason, att: editing.att }
    : { type: "annual", start: dstr(1), end: dstr(1), half: {}, reason: "", att: "" });
  if (!f.half) f.half = {};
  // lt() returns undefined for a code that is no longer a leave type — HR deleting one
  // while a draft is open, say. That used to blank the entire page, which is the worst
  // failure this app can have: nothing on screen and nothing to click.
  if (!lt(f.type)) f.type = (types[0] || db.leaveTypes[0] || {}).code || "";
  vp.form = f;
  const t = ltSafe(f.type), b = bal(who.id, f.type);
  const allowHalf = allowsHalf(t);
  const half = allowHalf ? f.half : {};
  const wdays = workingDaysList(f.start, f.end);
  const days = wdCountHalf(f.start, f.end, half);
  const over = !t.noDeduct && days > b.avail;
  const backdated = f.start < todayStr();
  // The breakdown comes from bal() and nowhere else. It used to be recomputed here from
  // different sources — granted from ledger rows dated this year, used from APPROVED
  // APPLICATIONS only — so every balance adjustment, expiry write-off and correction was
  // invisible to it. Live symptom: "Available 444 (Current Year: 951 · Used: 0)" on this
  // page while My leave entitlement correctly showed 951 / 507 / 444 for the same person.
  // One quantity, one implementation; the two screens now render the same statement.
  const curYear = todayStr().slice(0, 4);
  const yearEnd = curYear + "-12-31";
  const nextYearBlocked = (f.start || "").slice(0, 4) > curYear || (f.end || "").slice(0, 4) > curYear;
  // Warn as soon as the dates are chosen, not on submit — being told at the last
  // step, after filling everything in, is the complaint this fixes.
  const clash = (f.start && f.end) ? selfOverlap(f, vp.editId) : null;
  return `
    <h2>${editing ? "Amend & resubmit" : onBehalf ? "Enter leave for an employee" : "Apply for leave"}</h2>
    <p class="sub">${onBehalf
      ? `Applying for <b>${esc(who.name)}</b>. It is approved immediately and appears in their own list, marked as entered by you.`
      : (me.approver1 ? "On submit, an email goes to your approver: " + chainText(me) : "No approver required — your leave is recorded automatically, and HR is notified for the record.")}</p>
    ${onBehalf ? `<div class="field" style="max-width:340px"><label>Employee<span class="req">*</span></label>
      <select data-f="forEmp">${activeEmps().map(e => `<option value="${e.id}" ${e.id === who.id ? "selected" : ""}>${esc(e.name)}${e.dept ? " · " + esc(e.dept) : ""}</option>`).join("")}</select>
      <span class="hint">Everyone currently employed. Add someone and they appear here; offboard them and they go.</span></div>` : ""}
    ${editing ? `<div class="callout warn" style="margin-bottom:14px">This application was returned: “${esc(lastReturnComment(editing))}”. Amend it and resubmit for approval.</div>` : ""}
    <div class="card" style="max-width:640px;margin:0 auto">
      <div class="field"><label>Leave type</label>
        <select data-f="type">${types.map(x => `<option value="${x.code}" ${x.code === f.type ? "selected" : ""}>${esc(x.en)}</option>`).join("")}</select>
        <span class="hint">${t.noDeduct
          ? (t.code === "unpaid"
              ? "Unpaid leave may result in a salary deduction, depending on your company's policy."
              : "Recorded for HR's records only — it doesn't use any leave balance.")
          : `Available Balance: <b>${fmtD(b.avail)}</b> days (${carryLine(t.code, b)}Entitled this year: ${fmtD(b.yGranted)} · Taken: ${fmtD(b.yUsed)} · Pending: ${fmtD(b.pending)})`}</span>
      </div>
      <div class="frow">
        <div class="field"><label>Start date<span class="req">*</span></label><input type="date" data-f="start" value="${f.start}" max="${yearEnd}"></div>
        <div class="field"><label>End date<span class="req">*</span></label><input type="date" data-f="end" value="${f.end}" max="${yearEnd}"></div>
      </div>
      ${wdays.length && allowHalf ? `<div class="field"><label>Half days <span style="font-weight:400;color:var(--muted)">— optional</span></label>
        <div class="hint" style="margin:-2px 0 8px">By default, each selected day is counted as a full day. Change any day to Morning or Afternoon if you're taking only half a day.</div>
        <div class="hdlist">${wdays.map(ds => `<div class="hdrow"><span>${fmtDate(ds)} · ${new Date(ds + "T00:00:00").toLocaleDateString("en-SG", { weekday: "short" })}</span>
          <select data-f="half" data-d="${ds}">
            <option value="" ${!f.half[ds] ? "selected" : ""}>Full day</option>
            <option value="am" ${f.half[ds] === "am" ? "selected" : ""}>Morning only (AM)</option>
            <option value="pm" ${f.half[ds] === "pm" ? "selected" : ""}>Afternoon only (PM)</option>
          </select></div>`).join("")}</div></div>` : ""}
      <div class="callout acc" style="margin:12px 0">
        <b style="font-size:17px">${fmtD(days)}</b> working day${days === 1 ? "" : "s"} — Singapore public holidays excluded automatically
        ${backdated ? " · <b>Backdated</b>" : ""}
      </div>
      ${over ? `<div class="callout warn" style="margin:0 0 12px">Insufficient balance: this needs ${fmtD(days)} day${days === 1 ? "" : "s"} but only ${fmtD(b.avail)} available</div>` : ""}
      ${clash ? `<div class="callout warn" style="margin:0 0 12px">⚠ <b>These dates overlap leave you've already applied for.</b><br>
        ${esc(ltName(clash.type))} · ${fmtRange(clash.start, clash.end)} · <span class="pill st-${clash.status}">${stName(clash.status)}</span><br>
        <span class="meta">Pick different dates, or withdraw/cancel that application first.</span></div>` : ""}
      ${nextYearBlocked ? `<div class="callout warn" style="margin:0 0 12px">📅 <b>Next year is view-only for now.</b> Leave dated in ${Number(curYear) + 1} opens for applications on 1 Jan ${Number(curYear) + 1} (that's when next year's balance is granted). You can already preview ${Number(curYear) + 1} public holidays in the <b>Calendar</b> tab.</div>` : ""}
      <div class="field"><label>Remarks<span class="req">*</span></label><textarea data-f="reason" rows="2" placeholder="Provide a brief reason for your leave request.">${esc(f.reason)}</textarea></div>
      ${t.mc ? `<div class="callout warn" style="margin:0 0 12px">📄 <b>MC required:</b> attach a photo or PDF of your MC below, and submit the <b>original hardcopy to HR within 3 working days</b>.</div>` : ""}
      <div class="field"><label>Attachment${t.mc ? ` (photo or PDF of your MC)<span class="req">*</span>` : "s"}</label>
        <input type="file" data-f="attfile"${t.mc ? ` accept="image/*,.pdf" capture="environment"` : ""}>${f.att ? `<span class="hint">Selected: ${esc(f.att.split("/").pop().replace(/^\d+_/, ""))}</span>` : ""}
        <span class="hint">${t.mc ? "Only you, your approver and HR can open this file." : "You may attach supporting documents (e.g., a flight itinerary or booking confirmation) if they help provide additional context for your request. Only you, your approver, and HR can view the attachment."}</span></div>
      <div class="actions">
        <button class="btn" data-act="submit" ${days <= 0 || over || nextYearBlocked || clash ? "disabled" : ""}>${editing ? "Resubmit" : "Submit application"}</button>
        ${editing ? `<button class="btn sec" data-act="nav" data-v="myapps">Discard changes</button>` : ""}
      </div>
    </div>`;
}
function lastReturnComment(a) { const s = [...a.steps].reverse().find(x => x.status === "returned"); return s ? s.comment : ""; }

let submitting = false; // guards against double-click / slow-network duplicate submits
async function doSubmit() {
  const f = vp.form, t = lt(f.type);
  if (!t) return toast("Please choose a leave type.");
  const allowHalf = allowsHalf(t);
  const wdays = workingDaysList(f.start, f.end);
  const half = allowHalf ? (f.half || {}) : {};
  const halfDays = wdays.filter(ds => half[ds]).map(ds => ({ d: ds, part: half[ds] }));
  const days = wdCountHalf(f.start, f.end, half);
  if (!f.reason.trim()) return toast("Please add a brief reason for your leave.");
  if (t.mc && !f.att) return toast("Please attach a photo or PDF of your MC for this leave type.");
  if (t.mc && f.att && !/\.(jpe?g|png|heic|heif|webp|gif|pdf)$/i.test(f.att)) return toast("Your MC needs to be a photo or a PDF.");
  const clash = selfOverlap(f, vp.editId);
  if (clash) return toast(`These dates overlap your ${ltName(clash.type)}, ${fmtRange(clash.start, clash.end)}.`);
  if (submitting) return;               // a submit is already in flight — ignore the extra click
  submitting = true;
  const btn = document.querySelector('[data-act="submit"]'), label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
  try {
    const editId = vp.editId;
    // Upload the attachment to private storage first; the application stores its path.
    let att = f.att || "", uploadedPath = "";
    if (f._file) {
      const safe = f._file.name.replace(/[^\w.\-]/g, "_");
      const path = applySubject().id + "/" + Date.now() + "_" + safe;
      const { error: upErr } = await sb.storage.from("attachments").upload(path, f._file);
      if (upErr) return rpcErr(upErr);
      att = path; uploadedPath = path;
    }
    // Declared BEFORE the call that reads it — it was below, which is a crash, not a bug
    // you can argue about.
    const subj = applySubject(), onBehalf = !!vp.hrApply;
    const res = await submitApp({ type: f.type, start: f.start, end: f.end, halfDays, days, reason: f.reason.trim(), att, backdated: f.start < todayStr(), forEmp: onBehalf ? subj.id : null }, editId);
    // On failure, delete the just-uploaded file so a rejected submit doesn't orphan storage.
    if (!res) { if (uploadedPath) await sb.storage.from("attachments").remove([uploadedPath]); return; }
    const approverName = subj.approver1 ? (emp(subj.approver1) || {}).name || "your approver" : "";
    if (onBehalf) {
      // Stay where HR is working — sending them to "My applications" would show their own
      // leave, not the one they just entered.
      const nm = subj.name;
      vp = {}; render();
      toast(fmtD(days) + " day" + (days === 1 ? "" : "s") + " of " + ltName(f.type) + " recorded for " + nm + " and approved.");
    } else {
      vp = {}; view = "myapps"; render();
      toast(res.auto ? "Your leave has been recorded and approved automatically. HR has been notified." : "Your application has been submitted and sent to " + approverName + " for approval.");
    }
  } finally {
    submitting = false;
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; }
  }
}

function appTable(list, showWho) {

    }).join("")}</tbody></table></div>`;
}

/* ---- Company calendar ---- */
function vCalendar() {
  const m = vp.calMonth || todayStr().slice(0, 7);
  vp.calMonth = m;
  const [Y, M] = m.split("-").map(Number);
  const dim = new Date(Y, M, 0).getDate();
  const startPad = (new Date(Y, M - 1, 1).getDay() + 6) % 7; // Monday-first grid
  const monthName = new Date(Y, M - 1, 1).toLocaleString("en-SG", { month: "long", year: "numeric" });
  const q = (vp.calSearch || "").toLowerCase();
  // Company-wide leave from the leave_calendar view (name/dates/status only)
  const leaves = (db.calendar || []).filter(a => !q || a.name.toLowerCase().includes(q));
  // When searching one person, list their leave in this month above the grid
  const monthHits = q ? leaves.filter(a => a.start.slice(0, 7) <= m && m <= a.end.slice(0, 7)) : [];
  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(`<div class="day off"></div>`);
  for (let d = 1; d <= dim; d++) {
    const ds = Y + "-" + pad(M) + "-" + pad(d);
    const dow = new Date(Y, M - 1, d).getDay();
    const isPH = db.publicHolidays.includes(ds);
    const off = dow === 0 || dow === 6 || isPH;
    // Filter by the schedule of whoever OWNS the leave, not the viewer's: once some
    // staff work Saturdays, a Saturday chip is right for them and wrong for others.
    const chips = leaves.filter(a => a.start <= ds && ds <= a.end && isWorkingDayFor(ds, a.worksSat)).map(a => {
      const approved = a.status !== "pending";
      return `<span class="lvchip ${approved ? "ap" : "pd"}" title="${esc(a.name)} — ${approved ? "Approved" : "Pending approval"}">${esc(a.name)}</span>`;
    }).join("");
    cells.push(`<div class="day${off ? " off" : ""}${ds === todayStr() ? " today" : ""}">
      <div class="dnum"><span>${d}</span>${isPH ? `<span class="ph">PH</span>` : ""}</div>
      ${isPH ? `<div class="phname" title="${esc(db.phNames[ds] || "Public holiday")}">${esc(db.phNames[ds] || "Public holiday")}</div>` : ""}
      <div class="chips">${chips}</div></div>`);
  }
  return `<h2>Company leave calendar</h2>
    <p class="sub">Everyone can see who is away. Approved leave shows in solid colour; leave still pending approval is faded. Use <b>Next ›</b> to preview next year's public holidays (applications for next year open on 1 Jan).</p>
    <div class="card">
      <div class="calhead">
        <button class="btn sec" data-act="calmove" data-dir="-1">‹ Prev</button>
        <h3>${esc(monthName)}</h3>
        <button class="btn sec" data-act="calmove" data-dir="1">Next ›</button>
        <span class="spacer"></span>
        <input type="search" id="calsearch" data-f="calSearch" value="${esc(vp.calSearch || "")}" placeholder="🔍 Search a name…" style="max-width:190px">
        <button class="btn ghost" data-act="calmove" data-dir="0">Today</button>
      </div>
      ${q ? `<div class="callout acc" style="margin-bottom:10px">${
        monthHits.length
          ? `<b>${esc(vp.calSearch)}</b> — leave in ${esc(monthName)}: ` + monthHits.map(a => `${esc(a.name)} ${fmtRange(a.start, a.end)} (${a.status === "pending" ? "pending" : "approved"})`).join(" · ")
          : `No leave found for “${esc(vp.calSearch)}” in ${esc(monthName)} — try Prev/Next month`}</div>` : ""}
      <div class="calbox"><div class="cal">
        ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("")}
        ${cells.join("")}
      </div></div>
      <div class="legend">
        <span><span class="lvchip ap">Name</span> approved</span>
        <span><span class="lvchip pd">Name</span> pending approval</span>
        <span>Grey days = weekend / public holiday (PH)</span>
      </div>
    </div>`;
}

/* Annual-leave calculation: joined this year → pro-rated by remaining months;
   otherwise base + 1 day per additional full year of service. */
function annualCalc(joinDate, base) {
  const y = new Date().getFullYear();
  const jy = Number(String(joinDate).slice(0, 4)) || y, jm = Number(String(joinDate).slice(5, 7)) || 1;
  if (jy >= y) {
    const monthsLeft = 12 - jm + 1;
    let days = Math.ceil(base * monthsLeft / 12 * 2) / 2;
    const cap = db && db.org ? db.org.prorateCap : null;
    const capped = (cap != null && cap !== "" && days > Number(cap));
    if (capped) days = Number(cap);
    return { days, prorated: true, base, note: `pro-rated — ${monthsLeft} month${monthsLeft === 1 ? "" : "s"} of 12${capped ? `, capped at ${fmtD(Number(cap))}` : ""}` };
  }
  const extra = Math.max(0, y - jy - 1);
  // The company maximum applies to the long-service branch, exactly as v14's SQL does
  // (`least(base + years, annual_cap)`). This mirror left it out, so a long-serving hire
  // previewed 33 while the database would grant 21 — the same "screen disagrees with the
  // data" fault as the Apply breakdown. Blank/absent maximum = no ceiling.
  const maxAL = db && db.org && db.org.annualCap != null && db.org.annualCap !== "" ? Number(db.org.annualCap) : null;
  const raw = base + extra;
  const days = (maxAL != null && raw > maxAL) ? maxAL : raw;
  return { days, base, note: `${base} base + ${extra} for ${y - jy} year${(y - jy) === 1 ? "" : "s"} of service = ${fmtD(raw)} day${raw === 1 ? "" : "s"}`
    + (days !== raw ? `, capped at the company maximum of ${fmtD(maxAL)}` : "") };
}

/* Only send updated_at once v13 has added the column — otherwise every manual

function phStamp() { return db.hasPhWhen ? { updated_at: new Date().toISOString() } : {}; }

/* v24 — two dropdowns rather than a typed box. Three reasons, in order of how much
   trouble they save: an impossible date cannot be picked at all; the Day list follows the
   Month, so switching to April drops the 31st instead of storing it; and a <select> has
   no caret to lose, so this control sidesteps THE CARET RULE rather than having to obey
   it (a type="number" box that re-renders as you type is what turned 15 into 51). */
function carryExpiryField() {
  const e = expiryPick();
  const nextYear = new Date().getFullYear() + 1;
  const on = carryExpiryDate(e.mon, e.day, nextYear);
  const days = e.mon ? daysInMon(e.mon) : 31;
  return `<div class="field" style="max-width:300px"><label>Carry Forward AL expiry date</label>
    <div style="display:flex;gap:8px">
      <select data-f="org.carryMon" style="flex:2;min-width:0">
        <option value="" ${e.mon ? "" : "selected"}>— Never expires —</option>
        ${MONFULL.map((n, i) => `<option value="${i + 1}" ${e.mon === i + 1 ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      <select data-f="org.carryDay" style="flex:1;min-width:0" ${e.mon ? "" : "disabled"}>
        ${Array.from({ length: days }, (_, i) => i + 1).map(d =>
          `<option value="${d}" ${e.day === d ? "selected" : ""}>${d}</option>`).join("")}
      </select>
    </div>
    <span class="hint">${on
      ? `Days carried into ${nextYear} must be used by <b>${fmtDateY(on)}</b>. It repeats every year — set it once.`
      : `Carried days <b>never expire</b>. Pick a month to give them a deadline.`
      } How many days each person may carry is set per employee, on the Employees tab.</span></div>`;
}

function hrSettings() {
  const o = db.org || {};
  const y = new Date().getFullYear();
  const gy = numOr(vp.grantYear, y); // HR-selected target year for entitlements (default: current year)
  const phSorted = db.publicHolidays.slice().sort();
  // One year on screen at a time. The heading used to count the CURRENT year while the
  // table listed EVERY year, so the moment next year's dates arrived the count and the
  // rows disagreed. Both now read the same `phY`, so they cannot drift apart again.
  // EVERY year is reachable, not only the ones that already have dates in them. Built from
  // the data, ▶ was dead at the last year on file — so there was no way to stand on an
  // empty 2028 and start entering it, which is precisely when you need to be there.
  const phY = String(Math.min(PH_MAX, Math.max(PH_MIN, numOr(vp.phYear, y))));
  const phPrev = +phY > PH_MIN ? String(+phY - 1) : "";
  const phNext = +phY < PH_MAX ? String(+phY + 1) : "";
  const phRows = phSorted.filter(p => p.startsWith(phY));
  const dow = p => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(p + "T00:00:00").getDay()];
  return `<div class="stack">
  <div class="card"><h3>Company details</h3>
    <div class="callout acc" style="margin:10px 0 14px"><b>Nothing about your company is hard-coded.</b> Set these once; every form uses them. Teams are managed in the Employees tab, leave allowances in the Leave types tab.</div>
    <div class="frow">
      <div class="field" style="max-width:260px"><label>Company name<span class="req">*</span></label><input type="text" id="org-company" data-f="org.company" value="${esc(oPick("company"))}">
        <span class="hint">Shown in the top bar and everywhere else</span></div>
      <div class="field" style="max-width:260px"><label>Email domain</label><input type="text" id="org-domain" data-f="org.domain" value="${esc(oPick("domain"))}" placeholder="company.com">
        <span class="hint">Add employee auto-fills name@this-domain</span></div>
    </div>
  </div>

  <div class="card"><h3>Defaults for new employees</h3>
    <p class="meta" style="margin:4px 0 12px">These only <b>pre-fill the Add employee form</b>. Changing them does not move anyone already in the system.</p>
    <div class="frow">
      ${/* Both 300px, and wide enough for either label to sit on ONE line. At 220px the
            longer of the two wrapped, which pushed its input a line lower than its
            neighbour's and left the row looking crooked. */""}
      <div class="field" style="max-width:300px"><label>${db.orgV18 ? "Default Annual Leave Entitled / Yr" : "Default annual leave base"}</label><input ${NUMBOX} id="org-base" data-f="org.base" value="${oPick("base")}">
        <span class="hint">Starting days per year for someone new. Each employee's own base can be changed afterwards.</span></div>
      ${db.orgV16 ? `<div class="field" style="max-width:300px"><label>Default Carry Forward AL Maximum Day</label><input ${NUMBOX} data-f="org.carryCap" value="${oPick("carryCap")}">
        <span class="hint">Starting carry-forward maximum for someone new. Each employee's own figure is on the Employees tab and in Edit employee.</span></div>` : ""}
    </div>
  </div>

  <div class="card"><h3>Leave policy</h3>
    <p class="meta" style="margin:4px 0 12px">Automatically credit 1/12 of the Annual Leave entitlement each month. Please note: Modifying this setting mid-year may cause negative balances if employees have already taken unaccrued leave.</p>
    ${db.orgV14 ? `<div class="frow">
      <div class="field" style="max-width:260px"><label>Maximum annual leave (total)</label>
        <input ${NUMBOX} data-f="org.annualCap" value="${oPick("annualCap")}" placeholder="no maximum">
        <span class="hint">The max limit of annual leave anyone can reach in total. Blank = no maximum. (Eg. if set at 20 all employee will be capped at 20days AL limit)</span>
        ${capBelowBase() ? `<div class="callout warn" style="margin:8px 0 0">⚠ <b>${esc(capBelowBase())}</b></div>` : ""}</div>
      <div class="field" style="max-width:260px"><label>Credit annual leave</label>
        <select data-f="org.accrualMode" disabled>
          <option value="annual" ${oPick("accrualMode") === "annual" ? "selected" : ""}>All at once (1 Jan)</option>
          <option value="monthly" ${oPick("accrualMode") === "monthly" ? "selected" : ""}>Monthly, as it is earned</option>
        </select>
        <span class="hint">🔒 Fixed — this is not something to change from here.</span></div>
      ${db.orgV24 ? carryExpiryField() : db.orgV16 ? `<div class="field" style="max-width:260px"><label>Carry Forward AL expire after (months)</label>
        <input ${NUMBOX} data-f="org.carryMonths" value="${oPick("carryMonths")}" placeholder="never expires">
        <span class="hint">Counted from 1 January, so 6 means carried days must be used by 30 June. Leave it blank and they never expire.How many days each person may carry is set per employee, on the Employees tab.</span></div>` : ""}
    </div>` : `<p class="meta">Run <code>migration_app_v14.sql</code> to enable the annual maximum and monthly accrual.</p>`}
    <p class="hint" style="margin:10px 0 0">Edit any field above, then click <b>Save changes</b> at the top of the page.</p>
  </div>
  <div class="card"><h3 style="display:flex;align-items:center;gap:8px">
      <button class="btn ghost" style="padding:2px 9px" data-act="phyear" data-y="${phPrev}" ${phPrev ? "" : "disabled"} title="${phPrev || "No earlier year"}">◀</button>
      <span>Public holidays — ${phRows.length} date${phRows.length === 1 ? "" : "s"} in ${phY}</span>
      <button class="btn ghost" style="padding:2px 9px" data-act="phyear" data-y="${phNext}" ${phNext ? "" : "disabled"} title="${phNext || "No later year"}">▶</button>

/* THE OFFBOARDING RECORD. offboard_employee writes one ledger entry per leave type — the
   remaining balance, negated, with the last day and whether it was encashed or cleared in
   the reason. That IS the record; there was simply no screen showing it, because v18 took
   away the tab that used to display the ledger. Reading it back needs no migration and
   covers everyone already offboarded.
   Only the wording of "encashed"/"cleared" is parsed, and only for a label — if it ever
   changes, the days and the types still show, which is what payroll needs. */
function offboardingOf(empId) {
  const rows = db.ledger.filter(l => l.empId === empId && /^Offboarding \(last day /.test(l.reason || ""));
  if (!rows.length) return null;
  const lines = rows.map(l => ({ code: l.type, name: ltName(l.type), days: -l.delta }))
                    .filter(x => x.days !== 0)
                    .sort((a, b) => (ltSafe(a.code).sort || 0) - (ltSafe(b.code).sort || 0));
  const first = rows[0].reason || "";
  // The mode word is deliberately not shown any more — the settlement choice is gone and
  // every offboarding clears, so the record simply states the days that were left.
  const on = (first.match(/last day ([0-9]{4}-[0-9]{2}-[0-9]{2})/) || [])[1] || null;
  return { lines, on, total: lines.reduce((n, x) => n + x.days, 0) };

function csvDownload(filename, rows) {

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

/* Short column headers, with a legend under the table. The known types get the
   abbreviation people actually use; anything HR adds later falls back to initials, so a
   new type never breaks the header row. */
const LT_SHORT = { annual: "AL", sick: "SL", hosp: "HL", childcare: "CCL", oil: "OIL",
  maternity: "ML", paternity: "PL", shared_parental: "SPL", infant: "UIC", adoption: "ADL",
  compassionate: "CL", marriage: "MRL", ns: "NS", unpaid: "UL" };
function ltShort(t) {
  if (LT_SHORT[t.code]) return LT_SHORT[t.code];
  const w = String(t.en || t.code).replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean);
  return (w.map(x => x[0]).join("") || String(t.code).slice(0, 3)).toUpperCase().slice(0, 4);
}
// Carried-forward days still available to this person. HR reads it per employee; the
// employee's own screens read db.annualCarry, which is the same figure for themselves.
function carryOf(empId) {
  if (empId === me.id && db.annualCarry) return Math.max(0, Number(db.annualCarry.remaining) || 0);
  const y = new Date().getFullYear();
  const row = (db.allCarry || []).find(c => c.emp_id === empId && Number(c.year) === y && !c.expired_at);
  if (!row) return 0;
  // Same "carried days are used first" rule the database applies: what is left of the
  // carry is what was carried minus this year's annual leave already taken.
  const taken = db.applications
    .filter(a => a.empId === empId && a.type === "annual" && a.status === "approved" &&
                 String(a.start).slice(0, 4) === String(y))
    .reduce((n, a) => n + Number(a.days || 0), 0);
  return Math.max(0, (Number(row.carry_in) || 0) - taken);
}

      <div class="field"><label>Leave type<span class="req">*</span></label><select data-f="led.type">

      <div class="field"><label>Days (+ credit / − deduct)<span class="req">*</span></label><input ${NUMBOX} value="${f.delta === "" || f.delta == null ? "" : f.delta}" data-f="led.delta" placeholder="e.g. 1 or -2"></div>
    </div>

    ${ledPreview(f)}
    <button class="btn" data-act="ledadd" ${ledGoesNegative(f) && !vp.ledNegOk ? "disabled" : ""}>Add to ledger</button>
  </div>
  <div class="card"><h3>All adjustments (${recent.length}${q ? ` of ${db.ledger.length}` : ""}) — a balance is always the sum of all its entries</h3>
    <div class="frow" style="align-items:flex-end;margin-bottom:8px">
      <div class="field" style="max-width:280px"><label>Search</label>
        <input type="search" id="ledsearch" data-f="ledSearch" value="${esc(vp.ledSearch || "")}" placeholder="Name, leave type or reason…"></div>
    </div>
    <p class="meta" style="margin:0 0 8px">Click any column heading to sort; click again to reverse.</p>
    <div class="tablebox"><table><thead><tr>${H("ts", "Time", "num")}${H("emp", "Employee")}${H("type", "Type")}${H("delta", "±Days", "num")}${H("reason", "Reason")}${H("by", "By")}</tr></thead><tbody>
    ${led.map(l => `<tr><td class="num meta">${fmtTs(l.ts)}</td><td>${esc((emp(l.empId) || {}).name || "—")}</td><td>${esc((lt(l.type) || {}).en || l.type)}</td>
