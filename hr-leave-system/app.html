      <td>${esc(reasonEn(l.reason))}</td><td>${esc((emp(l.by) || {}).name || "system")}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;
}

/* ============ Login (email + password) ============ */
async function doLogin() {
  const email = (document.getElementById("li-email")?.value || "").trim();
  const password = document.getElementById("li-pass")?.value || "";
  if (!email || !password) return toast("Please enter your email and password");
  toast("Signing in…");
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return toast(error.message || "We couldn't sign you in. Please check your email and password.");
  await afterAuth();
}
let resetTimer = null;
function startResetCooldown() {
  clearInterval(resetTimer);
  resetTimer = setInterval(() => {
    if (!vp.reset || vp.reset.step !== "code") { clearInterval(resetTimer); return; }
    vp.reset.cooldown = Math.max(0, (vp.reset.cooldown || 0) - 1);
    // Update the button in place. A full render() here would blow away the code the
    // employee is halfway through typing, once every second.
    const btn = document.querySelector('[data-act="resetresend"]');
    if (btn) {
      btn.disabled = vp.reset.cooldown > 0;
      btn.textContent = vp.reset.cooldown > 0 ? `resend in ${vp.reset.cooldown}s` : "send another";
    }
    if (vp.reset.cooldown === 0) clearInterval(resetTimer);
  }, 1000);
}

/* ---- Self-service password reset (email OTP) ----
   Always answer identically whether or not the address exists: revealing that is
   free reconnaissance for anyone probing the sign-in page. */
const RESET_SENT_MSG = "If that email is registered, we've sent a 6-digit code.";

async function sendResetCode(email) {
  // shouldCreateUser:false is NOT optional — the default is true, which would let
  // anyone type any address and mint themselves an account on the HR system.
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  if (error && /rate|limit|seconds/i.test(error.message || "")) {
    toast("Please wait a moment before asking for another code");
    return false;
  }
  // Any other error (including "user not found") is swallowed on purpose.
  toast(RESET_SENT_MSG);
  return true;
}

async function verifyResetCode(email, token) {
  const { error } = await sb.auth.verifyOtp({ email, token, type: "email" });
  if (error) { toast("That code isn't right, or it has expired. Try again or send a new one."); return false; }
  return true;
}

async function setNewPassword(p1, p2) {
  if (p1.length < 8) { toast("Please use at least 8 characters"); return false; }
  if (p1 !== p2) { toast("The two passwords don't match"); return false; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { toast(error.message || "Could not set the password"); return false; }
  notifyPasswordChanged();   // fire-and-forget; must never block the change
  return true;
}

/* Tell the account holder their password changed. Supabase sends nothing itself, so
   without this an unauthorised reset would be completely silent to the real person. */
function notifyPasswordChanged() {
  try {
    sb.functions.invoke("send-notification", {
      body: { kind: "password_changed", at: new Date().toISOString() }
    }).catch(() => {});
  } catch (e) { /* never let a notification failure strand someone mid-reset */ }
}

async function afterAuth() {
  const linked = await loadMe();
  if (!linked) { render(); return; } // unlinked account message
  await loadAll();
  view = "dashboard"; vp = {}; render();
}
document.addEventListener("submit", ev => {
  if (ev.target && ev.target.id === "loginform") { ev.preventDefault(); doLogin(); }
});

/* ============ Event delegation ============ */
// Text selection guard: dragging from an input and releasing over the backdrop
// fires a click on .modalback. Only close when the press ALSO started there.
let pressOnBackdrop = false;
document.addEventListener("mousedown", ev => { pressOnBackdrop = ev.target.classList && ev.target.classList.contains("modalback"); });

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  // Keyed on the ELEMENT, not the action name, so every present and future modal
  // inherits it. Keyed on "closemodal" it protected only the modals that happened to
  // use that action, and the confirm dialog closed on a click anywhere in its own body.
  if (el.classList.contains("modalback") && (ev.target !== el || !pressOnBackdrop)) return;
  if (act === "dologin") { ev.preventDefault(); return doLogin(); }
  return runAction(el);
});

/* Every data-act lives here rather than inline in the listener, so the confirm dialog
   can re-enter the SAME handler with the action it was standing in for. The dialog then
   stays a pure question and no action logic is duplicated to sit behind it.
   `el` is either a real element or a synthetic { dataset: {...} }. */
async function runAction(el) {
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "logout": signOut(); break;
    case "nav": if (draftDirty()) { vp.leaveTo = { kind: "nav", v: el.dataset.v }; render(); break; } view = el.dataset.v; vp = {}; render(); break;
    case "hrtab": if (draftDirty()) { vp.leaveTo = { kind: "hrtab", t: el.dataset.t }; render(); break; } hrTab = el.dataset.t; vp = {}; render(); break;
    case "hrsave": {
      // A days-per-year change reaches everybody's balance at once, so it is stated in
      // full before it happens — the same rule as balance adjustments and the holiday paste.
      const ch = typeDayChanges();
      const expPend = expiryChanged();
      if ((ch.length || expPend) && !vp.typeOk) {
        let lines = [];
        if (ch.length) lines = ch.map(c => `<b>${esc(c.name)}</b>: ${fmtD(c.before)} → <b>${fmtD(c.after)}</b> days per year.<br>` +
            `<b style="color:${c.delta > 0 ? "var(--good)" : "var(--bad)"}">${c.delta > 0 ? "+" : ""}${fmtD(c.delta)} day${Math.abs(c.delta) === 1 ? "" : "s"}</b> ` +
            `will be ${c.delta > 0 ? "credited to" : "deducted from"} <b>${c.affected}</b> employee${c.affected === 1 ? "" : "s"}.`)
            .concat(["Days already taken are not affected — nobody is reset. This is recorded as one company-wide amendment."]);
        if (expPend) {
          // Ask the database what it WOULD do, then say exactly that. The same function
          // performs the write, so the count here cannot disagree with what happens.
          const e = expiryPick();
          const { data, error } = await sb.rpc("set_carry_expiry",
            { p_month: e.mon, p_day: e.day, p_preview: true });
          if (error) return rpcErr(error);
          lines = lines.concat(expiryLines(data));
        }
        vp.confirmModal = {
          title: ch.length ? "Confirm leave amendment" : "Change the expiry date?",
          lines,
          okLabel: "Save changes", cancelLabel: "Cancel", act: "hrsaveok"
        };
        rerender(); break;
      }
      delete vp.typeOk;
      if (await saveDraft()) { delete vp.draft; await reloadKeep(); toast("Changes saved."); }
      break;
    }
    case "hrsaveok": { vp.typeOk = true; await runAction({ dataset: { act: "hrsave" } }); break; }
    case "hrdiscard": delete vp.draft; render(); break;
    case "hrkeep": delete vp.leaveTo; rerender(); break;
    case "hrdiscardleave": { const to = vp.leaveTo; delete vp.draft; delete vp.leaveTo; if (to && to.kind === "nav") view = to.v; else if (to) hrTab = to.t; vp = {}; render(); break; }
    case "hrsaveleave": { if (!(await saveDraft())) break; const to = vp.leaveTo; if (to && to.kind === "nav") view = to.v; else if (to) hrTab = to.t; vp = {}; await reload(); break; }

      }

    }
    case "empadd": vp.empModal = { mode: "add", id: null, emailTouched: false, form: { name: "", email: "", emailPrefix: "", dept: "", newDept: "", title: "", empNo: "", alias: "", mobile: "", hasLogin: true, gender: "", role: "", joinDate: todayStr(), approver1: "", twoLevel: false, approver2: null, annualBase: db.org?.defaultAnnualBase ?? 14, carryCap: db.org?.defaultCarryCap ?? 0, worksSat: undefined } }; snapEmp(); rerender(); break;
    case "empedit": { const e = emp(id); vp.empModal = { mode: "edit", id, form: { name: e.name, email: e.email, dept: e.dept, newDept: "", title: e.title || "", empNo: e.empNo || "", alias: e.alias || "", mobile: e.mobile || "", hasLogin: e.hasLogin !== false, gender: e.gender, role: e.role, joinDate: e.joinDate, approver1: e.approver1 || APPR_NONE, twoLevel: e.twoLevel, approver2: e.approver2 || "", annualBase: e.annualBase ?? 14, carryCap: e.carryCap ?? 0, worksSat: (e.worksSat === true || e.worksSat === false) ? e.worksSat : undefined } }; snapEmp(); rerender(); break; }
    case "deptadd": {
      const inp = document.getElementById("newteam"), name = (inp?.value || "").trim();
      if (!name) return toast("Please type the team name first");
      if (db.departments.some(d => d.toLowerCase() === name.toLowerCase())) return toast("This team already exists");

    }

      if (!f.joinDate || !dmyToIso(fmtDMY(f.joinDate))) return toast("Please enter a valid hire date as day/month/year, e.g. 15/07/2026");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.trim())) return toast("Please enter a valid email");
      if (db.employees.some(x => x.email === f.email.trim() && x.id !== m.id)) return toast("This email is already in use");
      if (f.approver1 && f.approver2 && f.approver2 === f.approver1) return toast("The 2nd level approver must be different from the 1st.");
      // Complain in the order the fields appear on the form, so the message points at the

      if (!f.dept) return toast("Please choose a team");

      if (!f.gender) return toast("Please choose Female or Male — it decides which leave types apply.");
      if (!f.role) return toast("Please choose an account type");
      if (db.hasSat && f.worksSat !== true && f.worksSat !== false) return toast("Please choose whether this person works Saturdays");
      if (!f.approver1) return toast("Please choose a 1st level approver, or (auto-approve) if their leave needs nobody's approval.");
      // The database refuses a blank off-in-lieu reason. Saying so here means finding out
      // before the profile is written, not after — and every credit keeps a why.
      if (db.orgV18 && m.mode !== "add" && numOr(f.oilDays, 0) && !(f.oilReason || "").trim())
        return toast("Please give a reason for the off-in-lieu credit — every credit is recorded with one.");

      const base = numOr(f.annualBase, 14);
      { const m = baseAboveCap(base); if (m) return toast(m); }
      const a1 = appr1Id(f.approver1);
      const row = { name: f.name.trim(), email: f.email.trim(), dept, title: f.title.trim(), gender: f.gender,

      // changing it has to move this year's balance too. On add there is no balance yet.

      if (db.empExtra) { row.emp_no = (f.empNo || "").trim() || null; row.alias = (f.alias || "").trim() || null; row.mobile = (f.mobile || "").trim() || null; }
      if (m.mode === "add") {

        if (error) return rpcErr(error);

        // v18 removed pro-rating from the database, and this mirror was the last place
        // still halving it — so the screen and the data disagreed on a new joiner's days.
        const rows = [];
        for (const t of db.leaveTypes) {

        const nm = f.name.trim(), addedMsg = nm + " has been added, with " + fmtD(base) + " day" + (base === 1 ? "" : "s") + " of annual leave.";

    }
    case "amdcsv": {
      const rows = [["When", "Who changed it", "Employee", "Leave type", "What", "Change", "Reason"]];
      for (const a of (db.amendments || [])) {
        rows.push([fmtTs(Date.parse(a.at)), a.by_name || "", a.emp_name || "Whole company",
                   ltName(a.leave_type), kindName(a.kind),
                   a.delta_days == null ? "" : fmtD(Number(a.delta_days)), a.reason || ""]);
      }
      csvDownload("amendment-records-" + todayStr() + ".csv", rows);
      toast("Exported"); break;
    }
    case "amdview": vp.amdView = el.dataset.v; rerender(); break;
    case "ledcsv": {
      const q = (vp.ledSearch || "").toLowerCase();
      const rows = [["When", "Employee", "Team", "Leave type", "Days", "Reason", "Entered by"]];
      for (const l of db.ledger.slice().sort((a, b) => b.ts - a.ts)) {
        if (q && !empName(l.empId).toLowerCase().includes(q) && !(l.reason || "").toLowerCase().includes(q) &&
            !ltName(l.type).toLowerCase().includes(q)) continue;
        const e = emp(l.empId) || {};
        rows.push([fmtTs(l.ts), empName(l.empId), e.dept || "", ltName(l.type), fmtD(l.delta), l.reason || "", l.by ? empName(l.by) : ""]);
      }
      csvDownload("leave-ledger-" + todayStr() + ".csv", rows);
      toast("Ledger exported"); break;
    }
    case "offcsv": {
      const rows = [["Name", "Team", "Hire date", "Last working day", "Leave type", "Days left on last day"]];
      for (const e of db.employees.filter(x => x.active === false)) {
        const o = offboardingOf(e.id);
        if (!o) { rows.push([e.name, e.dept, e.joinDate || "", e.lastDay || "", "", "0"]); continue; }
        for (const l of o.lines) rows.push([e.name, e.dept, e.joinDate || "", e.lastDay || o.on || "", l.name, fmtD(l.days)]);
        rows.push([e.name, e.dept, e.joinDate || "", e.lastDay || o.on || "", "TOTAL", fmtD(o.total)]);
      }
      csvDownload("offboarding-" + todayStr() + ".csv", rows);
      toast("Offboarding records exported"); break;
    }
    case "balcsv": {
      const types = db.leaveTypes.filter(t => !t.noDeduct).sort((a, b) => a.sort - b.sort);
      const rows = [["Employee", "Team", ...types.flatMap(t => [t.en + " left", t.en + " entitled this year"])]];
      for (const e of activeEmps()) rows.push([e.name, e.dept, ...types.flatMap(t => { if (!eligible(t, e)) return ["n/a", "n/a"]; const b = bal(e.id, t.code); return [fmtD(b.avail), fmtD(b.yGranted)]; })]);
      csvDownload("leave-balances-" + todayStr() + ".csv", rows);
      toast("Balances exported"); break;
    }
    case "reccsv": {
      const rows = [["Employee", "Team", "Leave type", "Start", "End", "Days", "Status", "Reason", "Submitted"]];
      // Exactly what is on screen — same filter, same year — rather than a second copy of
      // the rules that could disagree with the table above it.
      for (const a of recFiltered()) {
        const e = emp(a.empId); if (!e) continue;
        rows.push([e.name, e.dept, (lt(a.type) || {}).en || a.type, a.start, a.end, fmtD(a.days), stName(a.status), a.reason, fmtTs(a.createdAt)]);
      }
      csvDownload("leave-records-" + recYearNow() + ".csv", rows);
      toast("Records exported"); break;
    }
    // ---- Start a new year ----
    case "yspreview": {
      const yr = numOr(vp.grantYear, new Date().getFullYear());
      vp.ysPreview = { loading: true }; rerender();
      const { data, error } = await sb.rpc("run_year_start", { p_year: yr, p_preview: true });
      vp.ysPreview = error ? { error: rpcMsg(error) } : { data };
      rerender(); break;
    }
    case "ysgo": {
      const yr = numOr(vp.grantYear, new Date().getFullYear());
      vp.ysPreview = { loading: true }; rerender();
      const { data, error } = await sb.rpc("run_year_start", { p_year: yr, p_preview: false });
      if (error) { vp.ysPreview = { error: rpcMsg(error) }; rerender(); break; }
      vp.ysPreview = { data, done: true };
      await reloadKeep();
      break;
    }
    case "yscancel": delete vp.ysPreview; rerender(); break;
    case "yscsv": {
      const d = (vp.ysPreview || {}).data || {};
      ysExport(d.rows || [], d.year || vp.grantYear);
      break;
    }
    case "yslogopen": {
      vp.ysLog = { loading: true }; rerender();
      const { data, error } = await sb.from("year_start_log").select("*").order("year", { ascending: false }).order("emp_name");
      if (error) { vp.ysLog = { rows: [], years: [] }; toast(rpcMsg(error)); rerender(); break; }
      const years = [...new Set((data || []).map(r => r.year))];
      vp.ysLog = { rows: data || [], years, year: years[0] };
      rerender(); break;
    }
    case "yslogclose": delete vp.ysLog; rerender(); break;
    case "yslogcsv": {
      const l = vp.ysLog || {};
      ysExport((l.rows || []).filter(r => String(r.year) === String(l.year)), l.year);
      break;
    }
    case "grantask": vp.grantConfirm = true; rerender(); break;
    case "grantcancel": delete vp.grantConfirm; rerender(); break;
    case "grantgo": {
      const yr = numOr(vp.grantYear, new Date().getFullYear());
      const { data, error } = await sb.rpc("grant_annual_entitlements", { p_year: yr });
      if (error) return rpcErr(error);
      delete vp.grantConfirm; await reloadKeep(); toast(`${yr} leave allowances have been added for everyone.`);
      break;
    }
    case "phdel": { const { error } = await sb.from("public_holidays").delete().eq("holiday", el.dataset.d); if (error) return rpcErr(error); await reloadKeep(); toast("Holiday removed"); break; }
    case "decide": {
      const d = el.dataset.d;
      const cm = (document.getElementById("cm-" + id) || {}).value || "";
      if ((d === "reject" || d === "return") && !cm.trim()) return toast(d === "reject" ? "A reason is required when rejecting" : "Please say what needs to be added before returning");
      const ackEl = document.getElementById("ack-" + id);
      if (await actOnStep(id, d, cm.trim(), !!(ackEl && ackEl.checked))) {
        rerender();  // refresh the page so the card leaves the waiting list right away
        toast(d === "approve" ? "✅ Approved — moved down to your Decision history" : d === "reject" ? "Rejected — the employee has been notified" : "Returned — the employee has been notified");
      }
      break;
    }
  }
}

document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.dataset.act === "ackbox") {
    const btn = document.querySelector(`[data-act="decide"][data-d="approve"][data-id="${el.dataset.id}"]`);
    if (btn) btn.disabled = !el.checked;
    return;
  }
  if (el.dataset.act === "grantyear") { vp.grantYear = numOr(el.value, new Date().getFullYear()); delete vp.ysPreview; rerender(); return; }
  if (el.dataset.act === "yslogyear") { if (vp.ysLog) vp.ysLog.year = el.value; rerender(); return; }
  if (el.dataset.act === "empf") {
    const id = el.dataset.id, f = el.dataset.f;
    // The entitlement is set in Edit employee only — the column came off this table at the
    // user's request, so there is no row-level box left to stage.
    if (f === "approver1") { stageEmp(id, "approver1", el.value || null); if (!el.value) stageEmp(id, "approver2", null); }
    else if (f === "approver2") stageEmp(id, "approver2", el.value || null);
    else if (f === "carryCap") stageEmp(id, "carryCap", Math.max(0, numOr(el.value, 0)));
    rerender(); return;
  }
  if (el.dataset.act === "typeall") {   // column header checkbox → set every leave type
    const k = el.dataset.k;
    if (k === "half" && !db.ltHalf) { el.checked = !el.checked; return toast("Please run the latest database update (migration v8) first to use half-day settings."); }
    setAllTypes(k, el.checked); rerender(); return;
  }
  if (el.dataset.act === "typedays") { setType(el.dataset.c, "days", numOr(el.value, 0)); rerender(); return; }
  if (el.dataset.act === "typehalf") {
    if (!db.ltHalf) { el.checked = !el.checked; return toast("Please run the latest database update (migration v8) first to use half-day settings."); }
    setType(el.dataset.c, "half", el.checked); rerender(); return;
  }
  if (el.dataset.act === "typeattach") { setType(el.dataset.c, "mc", el.checked); rerender(); return; }
  // Department default for Saturday working. Saved immediately, like the leave-type
  // ticks above. The per-employee override (null = follow team) resolves at read time.
  if (el.dataset.act === "lednegok") { vp.ledNegOk = el.checked; rerender(); return; }
  if (el.dataset.act === "deptsat") {
    const name = el.dataset.name, on = el.checked;
    const { error } = await sb.from("departments").update({ works_saturday: on }).eq("name", name);
    if (error) { el.checked = !on; return toast(error.message || "Could not save — has the v12 database update been run?"); }
    db.deptSat = Object.assign({}, db.deptSat, { [name]: on });
    keepScrollOnce = true; rerender();
    toast(`${name}: Saturday is now ${on ? "a working day" : "a non-working day"}`);
    return;
  }
  // Company settings save through the tab's own draft + "Save changes" bar (hrsave →
  // saveDraft), which is where the guards live: the company maximum may not drop below
  // anybody's entitlement, and the name may not be blank. There used to be a second
  // handler here writing org_settings straight from the DOM; nothing rendered it any
  // more, and it wrote only three of the seven settings with none of those checks.
  if (el.dataset.act === "deptname") {
    const oldName = el.dataset.old, newName = el.value.trim();
    if (!newName) { el.value = oldName; return toast("Team name cannot be empty"); }
    if (newName === oldName) return;
    if (db.departments.some(d => d !== oldName && d.toLowerCase() === newName.toLowerCase())) { el.value = oldName; return toast("Another team already has this name"); }
    // FK on update cascade updates every member's dept automatically
    const { error } = await sb.from("departments").update({ name: newName }).eq("name", oldName);
    if (error) { el.value = oldName; return rpcErr(error); }
    vp.teamsOpen = true; await reload(); toast(`Team renamed to "${newName}" — members updated`);
    return;
  }
  const f = el.dataset.f;
  if (!f) return;
  // Filters, not navigation → rerender() so the page stays where the user is looking.
  if (f === "stFilter") { vp.stFilter = el.value; rerender(); return; }
  if (f === "empDept") { vp.empDept = el.value; rerender(); return; }
  // Switching who HR is applying for clears the half-day picks and the balance line with
  // it — they belong to the previous person.
  if (f === "forEmp") { vp.forEmp = el.value; vp.form = null; rerender(); return; }
  // THE SWALLOWED FIRST CLICK. These used to be staged here, on `change`, which fires on
  // BLUR — and the handler re-rendered immediately. So: mouse-down blurs the field →
  // change → the page is rebuilt → mouse-up lands on a different button element → no
  // click event ever fires, because a click needs down and up on the SAME element. The
  // second click worked because nothing re-rendered that time.
  // They are staged as you type now (see the `input` listener), so by the time you click
  // there is nothing left to stage and nothing re-renders. This still runs for anything
  // arriving only as `change` — a <select>, or a paste with the mouse — and does nothing
  // when the value is already staged.
  if (f.startsWith("led.")) {
    const k = f.slice(4), v = isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value;
    if (vp.ledForm[k] === v) return;                 // already staged while typing
    vp.ledForm[k] = v;
    if (f === "led.empId" || f === "led.type") vp.ledNegOk = false;   // new target, re-confirm
    rerender();
    return;
  }
  if (f.startsWith("org.")) {
    const ov = isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value;
    if (vp.draft && vp.draft.org && vp.draft.org[f.slice(4)] === ov) return;
    stageOrg(f.slice(4), ov); rerender(); return;
  }
  if (f.startsWith("em.") && vp.empModal) {
    const k = f.slice(3);
    if (k === "joinDMY") {   // free-typed hire date → parse to ISO on blur, then reformat + refresh pro-rate
      const iso = dmyToIso(el.value);
      if (iso) { vp.empModal.form.joinDate = iso; vp.empModal.form.joinDMY = fmtDMY(iso); rerender(); }
      else if (el.value.trim()) toast("Please type the hire date as day/month/year, e.g. 15/07/2026");
      return;
    }
    if (k === "worksSat") {   // Yes / No only now; "" is the unchosen placeholder
      vp.empModal.form.worksSat = el.value === "yes" ? true : el.value === "no" ? false : undefined;
      rerender(); return;
    }
    vp.empModal.form[k] = el.type === "checkbox" ? el.checked : (isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value);
    if (k === "approver1" && !appr1Id(el.value)) { vp.empModal.form.twoLevel = false; vp.empModal.form.approver2 = ""; } // auto-approve ⇒ no 2-level
    // v24: `role` joins this list because the description list under the picker has to
    // follow it — without a redraw the highlight stays on whatever was chosen before.
    if (["joinDate", "twoLevel", "approver1", "approver2", "dept", "role"].includes(k)) rerender(); // refresh pro-rate preview / dependent selects / new-team field / account-type description
    return;
  }
  if (f.startsWith("off.") && vp.offModal) { vp.offModal[f.slice(4)] = el.value; return; }
  if (onApplyView() && vp.form) {
    if (f === "reason") { vp.form.reason = el.value; return; } // synced live via input; skipping re-render here keeps the submit click from being swallowed
    if (f === "attfile") {
      const file = el.files && el.files[0];
      vp.form._file = file || null;               // real File object, uploaded on submit
      vp.form.att = file ? file.name : "";
      rerender(); return;
    }
    if (f === "half") {
      const ds = el.dataset.d;
      if (!vp.form.half) vp.form.half = {};
      if (el.value) vp.form.half[ds] = el.value; else delete vp.form.half[ds];
      rerender(); return;
    }
    vp.form[f] = el.value;
    if (f === "start" && vp.form.end < vp.form.start) vp.form.end = vp.form.start;
    rerender();
  }
});
// <details> open state is lost on re-render; remember the Teams panel's state
document.addEventListener("toggle", ev => {
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-teams")) vp.teamsOpen = ev.target.open;
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-former")) vp.formerOpen = ev.target.open;
}, true);

document.addEventListener("input", ev => {
  const el = ev.target;
  if (onApplyView() && vp.form && el.dataset.f === "reason") vp.form.reason = el.value;
  const f = el.dataset.f || "";
  // Type a year, go to that year. Only acts on a COMPLETE four-digit year: reacting to
  // "20" on the way to "2029" would jump to year 20 and throw away what you were typing.
  if (f === "recYearSearch") {
    vp.recYearSearch = el.value.replace(/[^0-9]/g, "").slice(0, 4);
    const n = +vp.recYearSearch;
    if (vp.recYearSearch.length === 4 && n >= PH_MIN && n <= PH_MAX) vp.recYear = String(n);
    rerender();
    return;
  }
  if (f === "phYearSearch") {
    vp.phYearSearch = el.value.replace(/[^0-9]/g, "").slice(0, 4);
    const n = +vp.phYearSearch;
    if (vp.phYearSearch.length === 4 && n >= PH_MIN && n <= PH_MAX) vp.phYear = String(n);
    rerender();
    return;
  }
  const liveSearch = { empSearch: "empsearch", recSearch: "recsearch", calSearch: "calsearch", ledSearch: "ledsearch", amdSearch: "amdsearch" };
  if (liveSearch[f]) {
    // Live filter. TWO things must survive the re-render, and only one of them used to:
    //   · scroll position — rerender() resets it to 0 by design, so every keystroke threw
    //     the page back to the top. rerender() is the helper that keeps it. Filtering a
    //     list is not navigation; only changing page/tab should scroll to the top.
    //   · the caret — restored explicitly below rather than by rerender()'s own focus
    //     logic, because focusKey() keys off data-act and these inputs carry data-f.
    // Keep the real caret offsets: forcing it to value.length sent the cursor to the
    // end whenever someone edited the middle of what they had typed.
    const at = el.selectionStart, to = el.selectionEnd;
    vp[f] = el.value; rerender();
    const s = document.getElementById(liveSearch[f]);
    // preventScroll matters as much as rerender() here: a bare focus() scrolls the input
    // back into view, which undoes the scroll we just restored. rerender() already uses the same
    // flag for the control it re-focuses (see its focus-restore block).
    if (s) { s.focus({ preventScroll: true }); try { s.setSelectionRange(at, to); } catch (e) { /* type=search may refuse */ } }
    return;
  }
  // Sync modal text fields live so the save click (which blurs the field) never loses input
  if (vp.empModal && f.startsWith("em.") && el.type !== "checkbox") {
    const ek = f.slice(3);
    vp.empModal.form[ek] = isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value;
    // The joining-leave callout is computed from these two. Without a re-render it
    // kept showing the figure from when the modal opened — telling HR "6 days" while
    // the database correctly granted 6.5. A screen that disagrees with the data is
    // worse than a visible error. rerender() keeps the caret where it is.
    if (f === "em.annualBase" || f === "em.joinDMY" || f === "em.joinDate" || f === "em.oilDays") rerender();
    const emDomain = ((db.org || {}).emailDomain || "").trim();
    if (f === "em.email") vp.empModal.emailTouched = true;
    // On Add the address is assembled from an editable prefix and the company domain, so
    // the domain can never be typed wrong. The stored form.email stays the full address —
    // everything downstream (validation, duplicate check, save) still reads that one field.
    if (f === "em.emailPrefix") {
      vp.empModal.emailTouched = true;
      // Clean as they type, and write it back, so the box always shows what will be saved.
      // Dots and hyphens stay — jian.wei is a perfectly ordinary address; spaces and the
      // rest go, because they only surface later as "Please enter a valid email" pointing
      // at a field that no longer contains one.
      const at = el.selectionStart;
      const pre = el.value.toLowerCase().replace(/[^a-z0-9._-]/g, "");
      if (el.value !== pre) {
        el.value = pre;
        try { el.setSelectionRange(Math.max(0, at - 1), Math.max(0, at - 1)); } catch (e) { /* ignore */ }
      }
      vp.empModal.form.emailPrefix = pre;
      vp.empModal.form.email = pre && emDomain ? pre + "@" + emDomain : "";
    }
    if (f === "em.name" && vp.empModal.mode === "add" && !vp.empModal.emailTouched) {
      // Auto-suggest from the name (ASCII only — Chinese names are typed manually)
      const slug = el.value.toLowerCase().replace(/[^a-z0-9]/g, "");
      vp.empModal.form.emailPrefix = slug;
      vp.empModal.form.email = slug && emDomain ? slug + "@" + emDomain : "";
      const pi = document.querySelector('input[data-f="em.emailPrefix"]');
      if (pi) pi.value = slug;
      const em = document.querySelector('input[data-f="em.email"]');
      if (em) em.value = vp.empModal.form.email;
    }
  }
  // The preview has to track what is typed, so this re-renders on every keystroke.
  // rerender() keeps the modal's scroll and the caret (see rerender()).
  // allowsNeg(el), not a bare numText: this box takes a minus, and hard-coding the call
  // here is exactly how the field slipped past NEG_OK in the first place.
  if (f === "albump") { vp.albump = numText(el.value, allowsNeg(el)); rerender(); return; }
  if (vp.phBulk && f === "phb.text") { vp.phBulk.text = el.value; rerender(); return; }
  // Staged live rather than on blur — see the long note in the `change` listener. Text and
  // number boxes only: a <select> or checkbox has no half-typed state, and its `change` is
  // a deliberate choice rather than a side effect of clicking somewhere else.
  if (vp.ledForm && f.startsWith("led.") && (el.type === "text" || el.type === "number")) {
    const lk = f.slice(4);
    vp.ledForm[lk] = isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value;   // a deduction is -2
    rerender(); return;
  }
  if (f.startsWith("org.") && (el.type === "text" || el.type === "number")) {
    stageOrg(f.slice(4), isNumBox(el) ? numText(el.value, allowsNeg(el)) : el.value); rerender(); return;
  }
  if (vp.offModal && f.startsWith("off.") && el.type !== "radio") vp.offModal[f.slice(4)] = el.value;
});

/* ============ Boot ============ */
function bootScreen() {
  $app().innerHTML = `<div class="login"><div class="loginbox"><h1>LeaveDesk</h1><p class="tag">Loading…</p></div></div>`;
}
async function boot() {
  bootScreen();
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { await afterAuth(); return; }
  } catch (e) { /* offline / first load — fall through to the sign-in page */ }
  me = null; rerender();
}
if (typeof supabase === "undefined") {
  document.getElementById("app").innerHTML = '<div class="login"><div class="loginbox"><h1>LeaveDesk</h1><p class="tag">Could not load a required library. Check your internet connection and refresh.</p></div></div>';
} else {
  boot();
}
</script>
