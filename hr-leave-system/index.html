<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaveDesk SG — Leave Management (Demo)</title>
<style>
:root{
  --bg:#f2f4f7; --surface:#ffffff; --line:#dfe4ea; --ink:#1c2530; --muted:#5d6a79;
  --accent:#0c6b60; --accent-ink:#ffffff; --accent-soft:#e2f0ed; --accent-line:#b8dcd5;
  --good:#1a7a4a; --good-soft:#e2f2e8;
  --warn:#96590e; --warn-soft:#fcefd9;
  --bad:#b23a31; --bad-soft:#fbe6e4;
  --info:#6a4da3; --info-soft:#eee8f8;
  --gray-soft:#e9edf2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161d; --surface:#1a222c; --line:#2b3644; --ink:#e7edf3; --muted:#95a2b2;
    --accent:#37a08f; --accent-ink:#08211d; --accent-soft:#15352f; --accent-line:#26584f;
    --good:#4cbf82; --good-soft:#173226;
    --warn:#e0a34e; --warn-soft:#38290f;
    --bad:#e57a70; --bad-soft:#3a1c19;
    --info:#ab90e0; --info-soft:#291f3d;
    --gray-soft:#232d39;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"]{
  --bg:#f2f4f7; --surface:#ffffff; --line:#dfe4ea; --ink:#1c2530; --muted:#5d6a79;
  --accent:#0c6b60; --accent-ink:#ffffff; --accent-soft:#e2f0ed; --accent-line:#b8dcd5;
  --good:#1a7a4a; --good-soft:#e2f2e8; --warn:#96590e; --warn-soft:#fcefd9;
  --bad:#b23a31; --bad-soft:#fbe6e4; --info:#6a4da3; --info-soft:#eee8f8;
  --gray-soft:#e9edf2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#1a222c; --line:#2b3644; --ink:#e7edf3; --muted:#95a2b2;
  --accent:#37a08f; --accent-ink:#08211d; --accent-soft:#15352f; --accent-line:#26584f;
  --good:#4cbf82; --good-soft:#173226; --warn:#e0a34e; --warn-soft:#38290f;
  --bad:#e57a70; --bad-soft:#3a1c19; --info:#ab90e0; --info-soft:#291f3d;
  --gray-soft:#232d39;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:17px;letter-spacing:.2px}
.logo .beta{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:99px;letter-spacing:.08em}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.iconbtn{background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;position:relative}
.iconbtn:hover{background:var(--gray-soft);color:var(--ink)}
.badge{position:absolute;top:0;right:2px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;line-height:15px}
.nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:2px;overflow-x:auto}
.nav button{background:transparent;color:var(--muted);padding:11px 14px;border-radius:0;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav button:hover{color:var(--ink)}
.nav .cnt{display:inline-block;min-width:18px;text-align:center;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 5px;margin-left:6px;line-height:17px}

main{padding:22px 0 60px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}

.balgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.bal .t{font-size:13px;font-weight:600}
.bal .en{font-size:11px;color:var(--muted);letter-spacing:.04em}
.bal .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 0;color:var(--accent)}
.bal .n small{font-size:13px;color:var(--muted);font-weight:500}
.bal .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.st-approved{background:var(--good-soft);color:var(--good)}
.st-rejected{background:var(--bad-soft);color:var(--bad)}
.st-returned{background:var(--warn-soft);color:var(--warn)}
.st-withdrawn{background:var(--gray-soft);color:var(--muted)}
.st-cancel_requested{background:var(--info-soft);color:var(--info)}
.st-cancelled{background:var(--gray-soft);color:var(--muted)}

.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px;letter-spacing:.03em}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--gray-soft)}
td.num{font-variant-numeric:tabular-nums}

.btn{background:var(--accent);color:var(--accent-ink);padding:9px 18px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--gray-soft);color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.frow{display:flex;gap:14px;flex-wrap:wrap}
.frow .field{flex:1;min-width:160px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:16px;height:16px}

.callout{border-radius:var(--r);padding:12px 16px;font-size:13.5px;border:1px solid}
.callout.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}

.applist{display:flex;flex-direction:column;gap:12px}
.appcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.appcard .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.appcard .hd b{font-size:15px}
.meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:13.5px}
.step{display:flex;align-items:center;gap:8px}
.step .dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.step.ok .dot{background:var(--good-soft);color:var(--good)}
.step.now .dot{background:var(--warn-soft);color:var(--warn)}
.step.off .dot{background:var(--gray-soft);color:var(--muted)}
.step.no .dot{background:var(--bad-soft);color:var(--bad)}

.timeline{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.timeline li{padding:6px 0 6px 18px;border-left:2px solid var(--line);position:relative}
.timeline li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .tm{color:var(--muted);font-size:12px}

.modalback{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);max-width:620px;width:100%;padding:22px}
.modal .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .hd h3{flex:1;margin:0;font-size:17px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--gray-soft);color:var(--muted);padding:7px 14px;font-weight:600;font-size:13px;border-radius:99px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px}
.loginbox{max-width:760px;width:100%}
.loginbox h1{font-size:26px;margin:0 0 4px;letter-spacing:.2px}
.loginbox .tag{color:var(--muted);margin:0 0 20px;font-size:14px}
.acclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.acc{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px;text-align:left;width:100%}
.acc:hover{border-color:var(--accent);}
.acc .who{flex:1;min-width:0}
.acc .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .who span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolechip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.05em;flex:none}
.rl-employee{background:var(--gray-soft);color:var(--muted)}
.rl-approver{background:var(--accent-soft);color:var(--accent)}
.rl-hr{background:var(--info-soft);color:var(--info)}
.rl-admin{background:var(--warn-soft);color:var(--warn)}
.footnote{color:var(--muted);font-size:12.5px;margin-top:20px;line-height:1.7}

.mailbtn{position:relative;z-index:41}
.mailbackdrop{position:fixed;inset:0;z-index:39;background:transparent}
.mailpanel{position:absolute;right:0;top:44px;width:min(360px,88vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;max-height:min(420px,calc(100vh - 70px));overflow-y:auto}
.mailpanel .mi{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.mailpanel .mi b{display:block;font-size:13px}
.mailpanel .mi .tm{color:var(--muted);font-size:11.5px}
.mailpanel .mi p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.phchips{display:flex;flex-wrap:wrap;gap:6px}
.phchips span{background:var(--gray-soft);border-radius:6px;padding:2px 9px;font-size:12.5px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:26px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ============ Data layer (demo: localStorage; production: Supabase) ============ */
const LS_KEY = "sghr_demo_v3";
let db, me = null, view = "dashboard", vp = {}, hrTab = "records", mailOpen = false;

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => iso(new Date());
const dstr = off => { const d = new Date(); d.setDate(d.getDate() + off); return iso(d); };
const nowTs = () => Date.now();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTs = ts => { const d = new Date(ts); return iso(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtD = n => (n % 1 === 0 ? n : n.toFixed(1));

function seed() {
  const y = new Date().getFullYear();
  // Real org structure provided by the user (14 staff).
  // Leave approval goes DIRECT to Doris for: Michelle, Alice, Usam, Burak, Lin, 文斌
  // (even where their day-to-day reporting line differs). Everyone is single-level;
  // HR can switch anyone to a two-step chain in HR Console → Employees.
  const E = (id, name, title, dept, gender, role, approver1) =>
    ({ id, name, title, dept, gender, role, email: id + "@company.sg", joinDate: (y - 2) + "-01-01", approver1, approver2: null, twoLevel: false, mailSeen: 0 });
  const employees = [
    E("doris",    "Doris",    "Managing Director",       "Management",                "F", "admin",    null),
    E("michelle", "Michelle", "Sales Operation Manager", "Sales Operation",           "F", "approver", "doris"),
    E("tam",      "Tam",      "",                        "Bookshop Operation",        "M", "employee", "michelle"),
    E("phyllis",  "Phyllis",  "",                        "Bookshop Operation",        "F", "employee", "michelle"),
    E("alice",    "Alice",    "Retail Head & HR",        "Retail Operation",          "F", "hr",       "doris"),
    E("yukong",   "Yukong",   "",                        "Retail Operation",          "M", "employee", "alice"),
    E("amanda",   "Amanda",   "",                        "School Account Operations", "F", "employee", "michelle"),
    E("paulin",   "Paulin",   "",                        "School Account Operations", "F", "employee", "michelle"),
    E("daisy",    "Daisy",    "",                        "School Account Operations", "F", "employee", "michelle"),
    E("usam",     "Usam",     "Warehouse Dept Head",     "Warehouse",                 "M", "approver", "doris"),
    E("wenhan",   "文翰",     "",                        "Warehouse",                 "M", "employee", "usam"),
    E("burak",    "Burak",    "",                        "Logistics",                 "M", "employee", "doris"),
    E("lin",      "Lin",      "Operation Manager",       "Operation Team",            "M", "approver", "doris"),
    E("wenbin",   "文斌",     "",                        "Operation Team",            "M", "employee", "doris"),
  ];
  const leaveTypes = [
    { code: "annual", en: "Annual Leave", zh: "年假", mc: false, gender: null, noDeduct: false, days: 14, sort: 1 },
    { code: "sick", en: "Sick Leave (Outpatient)", zh: "病假", mc: true, gender: null, noDeduct: false, days: 14, sort: 2 },
    { code: "hosp", en: "Hospitalisation Leave", zh: "住院假", mc: true, gender: null, noDeduct: false, days: 60, sort: 3, note: "MOM: 60 days combined with outpatient sick leave; tracked separately in this demo" },
    { code: "childcare", en: "Childcare Leave", zh: "育儿假", mc: false, gender: null, noDeduct: false, days: 6, sort: 4 },
    { code: "oil", en: "Off-in-Lieu", zh: "补休", mc: false, gender: null, noDeduct: false, days: 0, sort: 5, note: "credited when you work overtime / on holidays" },
    { code: "maternity", en: "Maternity Leave", zh: "产假", mc: false, gender: "F", noDeduct: false, days: 112, sort: 6, note: "16 weeks (GPML)" },
    { code: "paternity", en: "Paternity Leave", zh: "陪产假", mc: false, gender: "M", noDeduct: false, days: 28, sort: 7, note: "4 weeks (GPPL)" },
    { code: "infant", en: "Unpaid Infant Care", zh: "无薪婴儿照顾假", mc: false, gender: null, noDeduct: false, days: 6, sort: 8 },
    { code: "compassionate", en: "Compassionate Leave", zh: "恩恤假", mc: false, gender: null, noDeduct: false, days: 3, sort: 9 },
    { code: "marriage", en: "Marriage Leave", zh: "婚假", mc: false, gender: null, noDeduct: false, days: 3, sort: 10 },
    { code: "ns", en: "NS / Reservist", zh: "战备军人假", mc: false, gender: "M", noDeduct: true, days: 0, sort: 11, note: "recorded only, no deduction" },
    { code: "unpaid", en: "Unpaid Leave", zh: "无薪假", mc: false, gender: null, noDeduct: true, days: 0, sort: 12 },
  ];
  // Singapore public holidays 2026 (HR maintains this list in production)
  const publicHolidays = [
    "2026-01-01","2026-02-17","2026-02-18","2026-03-21","2026-04-03","2026-05-01",
    "2026-05-27","2026-05-31","2026-06-01","2026-08-09","2026-08-10","2026-11-08","2026-11-09","2026-12-25"
  ];
  const ledger = [];
  const grant = (empId, type, delta, reason) =>
    ledger.push({ id: "L" + (ledger.length + 1), empId, type, delta, reason, refApp: null, by: "alice", ts: new Date(y, 0, 1, 9).getTime() });
  for (const e of employees) {
    grant(e.id, "annual", 14, y + " annual entitlement");
    grant(e.id, "sick", 14, y + " annual entitlement");
    grant(e.id, "hosp", 60, y + " annual entitlement");
    grant(e.id, "childcare", 6, y + " annual entitlement");
    grant(e.id, "compassionate", 3, y + " annual entitlement");
    grant(e.id, "marriage", 3, y + " annual entitlement");
  }
  grant("tam", "oil", 2, "Weekend stocktake — off-in-lieu credit");
  grant("wenbin", "oil", 1, "Public holiday duty — off-in-lieu credit");

  const applications = [], events = [], outbox = [];
  const ev = (appId, actor, action, comment, ts) => events.push({ appId, actor, action, comment: comment || "", ts });
  const mail = (to, subject, body, ts) => outbox.push({ id: "M" + (outbox.length + 1), to, subject, body, ts });

  // Completed: Tam took 1 day sick leave 20 days ago (approved by Michelle, deducted)
  applications.push({
    id: "A1", empId: "tam", type: "sick", start: dstr(-20), end: dstr(-20), sh: false, eh: false,
    days: 1, reason: "Fever, saw a doctor (MC attached)", att: "MC_clinic.pdf", status: "approved", cur: 0,
    steps: [{ order: 1, approverId: "michelle", status: "approved", comment: "Rest well", ts: nowTs() - 19.5 * 864e5 }],
    createdAt: nowTs() - 20 * 864e5, backdated: true
  });
  ev("A1", "tam", "Submitted", "", nowTs() - 20 * 864e5);
  ev("A1", "michelle", "Approved", "Rest well", nowTs() - 19.5 * 864e5);
  ledger.push({ id: "L" + (ledger.length + 1), empId: "tam", type: "sick", delta: -1, reason: "Leave taken", refApp: "A1", by: "michelle", ts: nowTs() - 19.5 * 864e5 });
  mail("tam@company.sg", "[Approved] Your Sick Leave application (1 day)", "Michelle approved your sick leave on " + dstr(-20) + ".\nNote: Rest well", nowTs() - 19.5 * 864e5);

  // Pending with Michelle: Tam's annual leave
  applications.push({
    id: "A2", empId: "tam", type: "annual", start: dstr(7), end: dstr(8), sh: false, eh: false,
    days: wdCount(dstr(7), dstr(8), false, false, publicHolidays), reason: "Family trip", att: "", status: "pending", cur: 0,
    steps: [{ order: 1, approverId: "michelle", status: "pending", comment: "", ts: null }],
    createdAt: nowTs() - 864e5, backdated: false
  });
  ev("A2", "tam", "Submitted", "", nowTs() - 864e5);
  mail("michelle@company.sg", "[Action required] Tam's Annual Leave application", "Tam applied for annual leave " + dstr(7) + " to " + dstr(8) + ". Please review in LeaveDesk.", nowTs() - 864e5);

  // Pending DIRECT with Doris: 文斌 (bypasses Lin per company rule)
  applications.push({
    id: "A3", empId: "wenbin", type: "annual", start: dstr(12), end: dstr(13), sh: false, eh: false,
    days: wdCount(dstr(12), dstr(13), false, false, publicHolidays), reason: "Personal matters", att: "", status: "pending", cur: 0,
    steps: [{ order: 1, approverId: "doris", status: "pending", comment: "", ts: null }],
    createdAt: nowTs() - 2 * 3600e3, backdated: false

/* Working-day count (excludes weekends + SG public holidays; supports half days) */
function wdCount(start, end, sh, eh, phList) {
  const ph = phList || db.publicHolidays;
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  if (!(s <= e)) return 0;
  const list = [];
  for (const d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6 && !ph.includes(iso(d))) list.push(iso(d));
  }
  let n = list.length;
  if (sh && list[0] === start) n -= 0.5;
  if (eh && list[list.length - 1] === end) n -= 0.5;
  if (n <= 0 && list.length) n = 0.5;
  return n;
}

function load() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { db = JSON.parse(raw); return; } } catch (e) {} db = seed(); save(); }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {} }
function resetDemo() { localStorage.removeItem(LS_KEY); me = null; db = seed(); save(); view = "dashboard"; render(); toast("Demo data has been reset"); }

const emp = id => db.employees.find(e => e.id === id);
const lt = c => db.leaveTypes.find(t => t.code === c);
const roleName = r => ({ employee: "Employee", approver: "Approver", hr: "HR", admin: "Admin" }[r] || r);
const stName = s => ({ pending: "Pending", approved: "Approved", rejected: "Rejected", returned: "Returned", withdrawn: "Withdrawn", cancel_requested: "Cancellation requested", cancelled: "Cancelled" }[s] || s);

function bal(empId, code) {
  let granted = 0, used = 0;
  for (const l of db.ledger) if (l.empId === empId && l.type === code) { if (l.delta > 0) granted += l.delta; else used -= l.delta; }
  let pending = 0;
  for (const a of db.applications) if (a.empId === empId && a.type === code && a.status === "pending") pending += a.days;
  return { granted, used, pending, avail: granted - used - pending };
}
function eligible(t, e) { return !t.gender || t.gender === e.gender; }

/* ============ Simulated email (production: Supabase Edge Function + Resend) ============ */
function sendMail(toEmpId, subject, body) { const to = emp(toEmpId); if (!to) return; db.outbox.push({ id: "M" + (++db.seq), to: to.email, subject, body, ts: nowTs() }); }
function logEv(appId, actor, action, comment) { db.events.push({ appId, actor, action, comment: comment || "", ts: nowTs() }); }
function hrIds() { return db.employees.filter(e => e.role === "hr").map(e => e.id); }

/* ============ State machine ============ */
function makeSteps(e) {
  if (!e.approver1) return []; // Managing Director: no approver → auto-approved on submit
  const s = [{ order: 1, approverId: e.approver1, status: "pending", comment: "", ts: null }];
  if (e.twoLevel && e.approver2) s.push({ order: 2, approverId: e.approver2, status: "waiting", comment: "", ts: null });
  return s;
}

function submitApp(data, editId) {
  const applicant = emp(me.id);
  const id = editId || "A" + (++db.seq);
  const t = lt(data.type);
  const steps = makeSteps(applicant);
  const base = { id, empId: me.id, ...data, status: "pending", cur: 0, steps, createdAt: nowTs() };
  if (editId) { const i = db.applications.findIndex(a => a.id === editId); db.applications[i] = { ...db.applications[i], ...base }; }
  else db.applications.push(base);
  logEv(id, me.id, editId ? "Resubmitted" : "Submitted");

  if (!steps.length) {
    // No approver (Managing Director) → auto-approve and notify HR for the record
    const a = db.applications.find(x => x.id === id);
    a.status = "approved";
    if (!t.noDeduct) db.ledger.push({ id: "L" + (++db.seq), empId: me.id, type: a.type, delta: -a.days, reason: "Leave taken", refApp: id, by: me.id, ts: nowTs() });
    logEv(id, me.id, "Auto-approved", "No approver required (Managing Director)");
    for (const h of hrIds()) if (h !== me.id)
      sendMail(h, "[Record] " + applicant.name + "'s " + t.en + " (auto-approved)",
        applicant.name + " recorded " + t.en + " " + data.start + " to " + data.end + " (" + fmtD(data.days) + " day(s)). No approval required; already deducted in the ledger.");
    save();
    return { id, auto: true };
  }

  sendMail(steps[0].approverId, "[Action required] " + applicant.name + "'s " + t.en + " application",
    applicant.name + " applied for " + t.en + " " + data.start + " to " + data.end + " (" + fmtD(data.days) + " day(s)).\nReason: " + data.reason + "\nPlease review in LeaveDesk.");
  save();
  return { id, auto: false };
}

function actOnStep(appId, action, comment) {
  const a = db.applications.find(x => x.id === appId);
  if (!a || a.status !== "pending") return;
  const step = a.steps[a.cur];
  if (step.approverId !== me.id) return;
  step.comment = comment || ""; step.ts = nowTs();
  const applicant = a.empId, t = lt(a.type);
  if (action === "approve") {
    step.status = "approved";
    if (a.cur + 1 < a.steps.length) {
      logEv(appId, me.id, "Approved (Level " + step.order + ")", comment);
      a.cur++; a.steps[a.cur].status = "pending";
      sendMail(a.steps[a.cur].approverId, "[Action required · Level " + a.steps[a.cur].order + "] " + emp(applicant).name + "'s " + t.en + " application",
        "Level " + step.order + " (" + me.name + ") has approved. Your final approval is required.");
      sendMail(applicant, "[Progress] Your " + t.en + " application passed Level " + step.order,
        me.name + " approved. Waiting for final approval by " + emp(a.steps[a.cur].approverId).name + ".");
    } else {
      a.status = "approved";
      logEv(appId, me.id, "Approved", comment);
      if (!t.noDeduct) db.ledger.push({ id: "L" + (++db.seq), empId: applicant, type: a.type, delta: -a.days, reason: "Leave taken", refApp: appId, by: me.id, ts: nowTs() });
      sendMail(applicant, "[Approved] Your " + t.en + " application (" + fmtD(a.days) + " day(s))",
        me.name + " approved your " + t.en + " " + a.start + " to " + a.end + "." + (comment ? "\nNote: " + comment : ""));
      for (const h of hrIds()) if (h !== applicant && h !== me.id)
        sendMail(h, "[Record] " + emp(applicant).name + "'s " + t.en + " approved", a.start + " to " + a.end + ", " + fmtD(a.days) + " day(s). Recorded in the leave ledger.");
    }
  } else if (action === "reject") {
    step.status = "rejected"; a.status = "rejected";
    logEv(appId, me.id, "Rejected", comment);
    sendMail(applicant, "[Rejected] Your " + t.en + " application", me.name + " rejected your application.\nReason: " + comment);
  } else if (action === "return") {
    step.status = "returned"; a.status = "returned";
    logEv(appId, me.id, "Returned", comment);
    sendMail(applicant, "[Returned] Your " + t.en + " application needs more information", me.name + " returned your application.\nNote: " + comment + "\nPlease amend and resubmit in LeaveDesk.");
  }
  save();
}

function withdrawApp(appId) {
  const a = db.applications.find(x => x.id === appId);
  if (!a || a.status !== "pending" || a.empId !== me.id) return;
  a.status = "withdrawn"; logEv(appId, me.id, "Withdrawn");
  if (a.steps.length) sendMail(a.steps[a.cur].approverId, "[Withdrawn] " + me.name + " withdrew the " + lt(a.type).en + " application", "No action needed.");
  save();
}
function requestCancel(appId) {
  const a = db.applications.find(x => x.id === appId);
  if (!a || a.status !== "approved" || a.empId !== me.id) return;
  const t = lt(a.type);
  if (!a.steps.length) {
    // Auto-approved leave (MD): cancel immediately, refund, notify HR
    a.status = "cancelled"; logEv(appId, me.id, "Cancelled", "Auto-confirmed (no approver required)");
    if (!t.noDeduct) db.ledger.push({ id: "L" + (++db.seq), empId: a.empId, type: a.type, delta: a.days, reason: "Cancellation refund", refApp: appId, by: me.id, ts: nowTs() });
    for (const h of hrIds()) if (h !== me.id)
      sendMail(h, "[Record] " + me.name + " cancelled " + t.en, a.start + " to " + a.end + " cancelled; " + fmtD(a.days) + " day(s) refunded.");
    save();
    return;
  }
  a.status = "cancel_requested"; logEv(appId, me.id, "Cancellation requested");
  sendMail(a.steps[0].approverId, "[Confirm cancellation] " + me.name + " wants to cancel approved " + t.en,
    a.start + " to " + a.end + ". Confirming will refund " + fmtD(a.days) + " day(s).");
  save();
}
function confirmCancel(appId, ok, comment) {
  const a = db.applications.find(x => x.id === appId);
  if (!a || a.status !== "cancel_requested") return;
  const t = lt(a.type);
  if (ok) {
    a.status = "cancelled"; logEv(appId, me.id, "Cancellation confirmed", comment);
    if (!t.noDeduct) db.ledger.push({ id: "L" + (++db.seq), empId: a.empId, type: a.type, delta: a.days, reason: "Cancellation refund", refApp: appId, by: me.id, ts: nowTs() });
    sendMail(a.empId, "[Cancelled] " + t.en + " — " + fmtD(a.days) + " day(s) refunded", "Your " + t.en + " " + a.start + " to " + a.end + " has been cancelled and the days refunded.");
  } else {
    a.status = "approved"; logEv(appId, me.id, "Cancellation declined", comment);
    sendMail(a.empId, "[Cancellation declined] Your " + t.en + " remains approved", comment ? "Note: " + comment : "");
  }
  save();
}

/* ============ Queries ============ */
function inbox(u) {
  const todo = db.applications.filter(a => a.status === "pending" && a.steps.length && a.steps[a.cur].approverId === u.id);
  const cancels = db.applications.filter(a => a.status === "cancel_requested" && a.steps.length && a.steps[0].approverId === u.id);
  return { todo, cancels, count: todo.length + cancels.length };
}
function isApprover(u) { return u.role !== "employee" || db.employees.some(e => e.approver1 === u.id || e.approver2 === u.id); }
function myMails(u) { return db.outbox.filter(m => m.to === u.email).sort((a, b) => b.ts - a.ts); }
function myDecisions(u) {
  // Sourced from the immutable event log (not from steps, which are rebuilt on
  // resubmission) so history survives amend-and-resubmit cycles.
  const isDecision = act => act === "Approved" || act.startsWith("Approved (Level") ||
    act === "Rejected" || act === "Returned" ||
    act === "Cancellation confirmed" || act === "Cancellation declined";
  return db.events
    .filter(v => v.actor === u.id && isDecision(v.action))
    .map(v => ({ a: db.applications.find(x => x.id === v.appId), decision: v.action, comment: v.comment, ts: v.ts }))
    .filter(r => r.a)
    .sort((x, y) => y.ts - x.ts);
}

  if (overlap) return toast("These dates overlap an existing application");
  const res = submitApp({ type: f.type, start: f.start, end: f.end, sh: f.sh, eh: f.eh, days, reason: f.reason.trim(), att: f.att, backdated: f.start < todayStr() }, vp.editId);

/* ============ Event delegation ============ */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) { if (mailOpen && !ev.target.closest(".mailpanel")) { mailOpen = false; render(); } return; }
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "closemodal" && ev.target !== el && el.classList.contains("modalback")) return;
  switch (act) {
    case "login": me = emp(el.dataset.id); view = "dashboard"; vp = {}; mailOpen = false; render(); break;
    case "logout": me = null; render(); break;
    case "reset": resetDemo(); break;
    case "nav": view = el.dataset.v; vp = {}; mailOpen = false; render(); break;
    case "mail": mailOpen = !mailOpen; if (mailOpen) { me.mailSeen = nowTs(); save(); } render(); break;
    case "closemail": mailOpen = false; render(); break;
    case "hrtab": hrTab = el.dataset.t; vp = {}; render(); break;
    case "detail": vp.detail = id; render(); break;
    case "closemodal": delete vp.detail; render(); break;
    case "submit": doSubmit(); break;
    case "withdraw": withdrawApp(id); delete vp.detail; render(); toast("Application withdrawn"); break;
    case "edit": vp = { editId: id }; view = "apply"; render(); break;
    case "cancelreq": {
      requestCancel(id); delete vp.detail; render();
      const a = db.applications.find(x => x.id === id);
      toast(a && a.status === "cancelled" ? "Leave cancelled — days refunded" : "Cancellation request sent to your approver");
      break;
    }
    case "cancelok": confirmCancel(id, true, ""); render(); toast("Cancellation confirmed — days refunded"); break;
    case "cancelno": confirmCancel(id, false, ""); render(); toast("Cancellation declined"); break;
    case "ledadd": {
      const f = vp.ledForm;
      if (!f.reason.trim()) return toast("Please fill in the reason");
      if (!f.delta) return toast("Days cannot be 0");
      db.ledger.push({ id: "L" + (++db.seq), empId: f.empId, type: f.type, delta: Number(f.delta), reason: "Manual adjustment: " + f.reason.trim(), refApp: null, by: me.id, ts: nowTs() });
      save(); vp.ledForm = { empId: f.empId, type: f.type, delta: 1, reason: "" }; render(); toast("Added to ledger");
      break;
    }
    case "decide": {
      const d = el.dataset.d;
      const cm = (document.getElementById("cm-" + id) || {}).value || "";
      if ((d === "reject" || d === "return") && !cm.trim()) return toast(d === "reject" ? "A reason is required when rejecting" : "Please say what needs to be added before returning");
      actOnStep(id, d, cm.trim());
      render(); toast(d === "approve" ? "Approved — emails sent automatically" : d === "reject" ? "Rejected — employee notified" : "Returned — employee notified");
      break;
    }
  }
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "empf") {
    const e = emp(el.dataset.id), f = el.dataset.f;
    if (f === "twoLevel") { e.twoLevel = el.checked; if (!el.checked) e.approver2 = null; }
    else e[f] = el.value || null;
    if (e.twoLevel && e.approver1 && e.approver1 === e.approver2) { e.approver2 = null; toast("Level 2 approver must differ from level 1"); }
    save(); render(); toast("Saved " + e.name + "'s approval route (affects new applications only)");
    return;
  }
  if (el.dataset.act === "typedays") {
    const t = lt(el.dataset.c); t.days = Number(el.value) || 0; save(); toast("Default days updated (affects future annual grants)");
    return;
  }
  const f = el.dataset.f;
  if (!f) return;
  if (f === "stFilter") { vp.stFilter = el.value; render(); return; }
  if (f.startsWith("led.")) { vp.ledForm[f.slice(4)] = el.type === "number" ? Number(el.value) : el.value; return; }
  if (view === "apply" && vp.form) {
    if (f === "reason") { vp.form.reason = el.value; return; } // synced live via input; skipping re-render here keeps the submit click from being swallowed
    if (f === "attfile") { vp.form.att = el.files && el.files[0] ? el.files[0].name : ""; render(); return; }
    if (f === "sh" || f === "eh") vp.form[f] = el.checked; else vp.form[f] = el.value;
    if (f === "start" && vp.form.end < vp.form.start) vp.form.end = vp.form.start;
    render();
  }
});
