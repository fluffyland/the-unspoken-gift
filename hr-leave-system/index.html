      const rows = r.add.map(a => Object.assign({ holiday: a.holiday, name: a.name, source: "manual" }, phStamp()));
      const { error } = await sb.from("public_holidays").insert(rows);
      if (error) return rpcErr(error);
      const n = r.add.length, skipped = r.dup.length;
      delete vp.phBulk;
      await reload();
      vp.resultModal = { title: "Public holidays added",
        lines: [`<b>${n}</b> date${n === 1 ? "" : "s"} added.`,
                skipped ? `<b>${skipped}</b> were already in the list and were left as they were.` : "",
                "Check them against MOM's published list before the year starts."].filter(Boolean) };
      render(); break;
    }
    case "phedit": { vp.phModal = { orig: el.dataset.d, date: el.dataset.d, name: el.dataset.n || "" }; render(); break; }
    case "phsave": {
      const m = vp.phModal || {};
      const typed = document.getElementById("ph-date")?.value || "";
      const d = dmyToIso(typed);
      const nm = (document.getElementById("ph-name")?.value || "").trim();
      if (!typed.trim()) return toast("Type the date first, as day/month/year — e.g. 15/07/2026");
      if (!d) return toast("That date doesn't look right. Type it as day/month/year, e.g. 15/07/2026");
      if (!nm) return toast("Please type the holiday's name");
      if (d !== m.orig && db.publicHolidays.includes(d)) return toast("That date is already in the list");
      if (m.orig && d === m.orig) {
        const { error } = await sb.from("public_holidays").update(Object.assign({ name: nm, source: "manual", synced_at: null }, phStamp())).eq("holiday", m.orig);
        if (error) return rpcErr(error);
      } else {
        if (m.orig) { const { error: de } = await sb.from("public_holidays").delete().eq("holiday", m.orig); if (de) return rpcErr(de); }
        const { error } = await sb.from("public_holidays").insert(Object.assign({ holiday: d, name: nm, source: "manual" }, phStamp()));
        if (error) return rpcErr(error);
      }
      delete vp.phModal; await reload(); toast(m.orig ? "Holiday updated" : "Holiday added");
      break;
    }
    case "balcsv": {
      const types = db.leaveTypes.filter(t => !t.noDeduct).sort((a, b) => a.sort - b.sort);
      const rows = [["Employee", "Team", ...types.flatMap(t => [t.en + " left", t.en + " entitled"])]];
      for (const e of activeEmps()) rows.push([e.name, e.dept, ...types.flatMap(t => { if (!eligible(t, e)) return ["n/a", "n/a"]; const b = bal(e.id, t.code); return [fmtD(b.avail), fmtD(b.granted)]; })]);
      csvDownload("leave-balances-" + todayStr() + ".csv", rows);
      toast("Balances exported"); break;
    }
    case "reccsv": {
      const rows = [["Employee", "Team", "Leave type", "Start", "End", "Days", "Status", "Reason", "Submitted"]];
      const fset = vp.stFilter || "all", q = (vp.recSearch || "").toLowerCase();
      for (const a of db.applications) {
        const e = emp(a.empId); if (!e) continue;
        if (fset !== "all" && a.status !== fset) continue;
        if (q && !e.name.toLowerCase().includes(q) && !e.email.toLowerCase().includes(q)) continue;
        rows.push([e.name, e.dept, (lt(a.type) || {}).en || a.type, a.start, a.end, fmtD(a.days), stName(a.status), a.reason, fmtTs(a.createdAt)]);
      }
      csvDownload("leave-records-" + todayStr() + ".csv", rows);
      toast("Records exported"); break;
    }
    case "grantask": vp.grantConfirm = true; render(); break;
    case "grantcancel": delete vp.grantConfirm; render(); break;
    case "grantgo": {
      const yr = numOr(vp.grantYear, new Date().getFullYear());
      const { data, error } = await sb.rpc("grant_annual_entitlements", { p_year: yr });
      if (error) return rpcErr(error);
      delete vp.grantConfirm; await reload(); toast(`${yr} leave allowances have been added for everyone.`);
      break;
    }
    case "phdel": { const { error } = await sb.from("public_holidays").delete().eq("holiday", el.dataset.d); if (error) return rpcErr(error); await reload(); toast("Holiday removed"); break; }
    case "decide": {
      const d = el.dataset.d;
      const cm = (document.getElementById("cm-" + id) || {}).value || "";
      if ((d === "reject" || d === "return") && !cm.trim()) return toast(d === "reject" ? "A reason is required when rejecting" : "Please say what needs to be added before returning");
      const ackEl = document.getElementById("ack-" + id);
      if (await actOnStep(id, d, cm.trim(), !!(ackEl && ackEl.checked))) {
        render();  // refresh the page so the card leaves the waiting list right away
        toast(d === "approve" ? "✅ Approved — moved down to your Decision history" : d === "reject" ? "Rejected — the employee has been notified" : "Returned — the employee has been notified");
      }
      break;
    }
  }
}

document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.dataset.act === "ackbox") {
    const btn = document.querySelector(`[data-act="decide"][data-d="approve"][data-id="${el.dataset.id}"]`);
    if (btn) btn.disabled = !el.checked;
    return;
  }
  if (el.dataset.act === "grantyear") { vp.grantYear = numOr(el.value, new Date().getFullYear()); rerender(); return; }
  if (el.dataset.act === "empf") {
    const id = el.dataset.id, f = el.dataset.f;
    if (f === "annualBase") {
      // Guard B on the per-row input: a base above the company maximum would be cut back
      // at the next grant, so refuse it here rather than let the two settings disagree.
      const m = baseAboveCap(numOr(el.value, 14));
      if (m) { toast(m); el.value = ePick(emp(id), "annualBase") ?? 14; return; }
      stageEmp(id, "annualBase", numOr(el.value, 14));
    }
    else if (f === "approver1") { stageEmp(id, "approver1", el.value || null); if (!el.value) stageEmp(id, "approver2", null); }
    else if (f === "approver2") stageEmp(id, "approver2", el.value || null);
    rerender(); return;
  }
  if (el.dataset.act === "typeall") {   // column header checkbox → set every leave type
    const k = el.dataset.k;
    if (k === "half" && !db.ltHalf) { el.checked = !el.checked; return toast("Please run the latest database update (migration v8) first to use half-day settings."); }
    setAllTypes(k, el.checked); rerender(); return;
  }
  if (el.dataset.act === "typedays") { setType(el.dataset.c, "days", numOr(el.value, 0)); rerender(); return; }
  if (el.dataset.act === "typehalf") {
    if (!db.ltHalf) { el.checked = !el.checked; return toast("Please run the latest database update (migration v8) first to use half-day settings."); }
    setType(el.dataset.c, "half", el.checked); rerender(); return;
  }
  if (el.dataset.act === "typeattach") { setType(el.dataset.c, "mc", el.checked); rerender(); return; }
  // Department default for Saturday working. Saved immediately, like the leave-type
  // ticks above. The per-employee override (null = follow team) resolves at read time.
  if (el.dataset.act === "lednegok") { vp.ledNegOk = el.checked; rerender(); return; }
  if (el.dataset.act === "deptsat") {
    const name = el.dataset.name, on = el.checked;
    const { error } = await sb.from("departments").update({ works_saturday: on }).eq("name", name);
    if (error) { el.checked = !on; return toast(error.message || "Could not save — has the v12 database update been run?"); }
    db.deptSat = Object.assign({}, db.deptSat, { [name]: on });
    keepScrollOnce = true; render();
    toast(`${name}: Saturday is now ${on ? "a working day" : "a non-working day"}`);
    return;
  }
  // Company settings now save via an explicit "Save changes" button (data-act="orgsave").
  if (el.dataset.act === "deptname") {
    const oldName = el.dataset.old, newName = el.value.trim();
    if (!newName) { el.value = oldName; return toast("Team name cannot be empty"); }
    if (newName === oldName) return;
    if (db.departments.some(d => d !== oldName && d.toLowerCase() === newName.toLowerCase())) { el.value = oldName; return toast("Another team already has this name"); }
    // FK on update cascade updates every member's dept automatically
    const { error } = await sb.from("departments").update({ name: newName }).eq("name", oldName);
    if (error) { el.value = oldName; return rpcErr(error); }
    vp.teamsOpen = true; await reload(); toast(`Team renamed to "${newName}" — members updated`);
    return;
  }
  const f = el.dataset.f;
  if (!f) return;
  // Filters, not navigation → rerender() so the page stays where the user is looking.
  if (f === "stFilter") { vp.stFilter = el.value; rerender(); return; }
  if (f === "empDept") { vp.empDept = el.value; rerender(); return; }
  if (f.startsWith("led.")) {
    vp.ledForm[f.slice(4)] = el.type === "number" ? Number(el.value) : el.value;
    if (f === "led.empId" || f === "led.type") vp.ledNegOk = false;   // new target, re-confirm
    rerender();   // keeps focus/caret; the balance preview must track what you type
    return;
  }
  if (f.startsWith("org.")) { stageOrg(f.slice(4), el.value); rerender(); return; }
  if (f.startsWith("em.") && vp.empModal) {
    const k = f.slice(3);
    if (k === "joinDMY") {   // free-typed hire date → parse to ISO on blur, then reformat + refresh pro-rate
      const iso = dmyToIso(el.value);
      if (iso) { vp.empModal.form.joinDate = iso; vp.empModal.form.joinDMY = fmtDMY(iso); rerender(); }
      else if (el.value.trim()) toast("Please type the hire date as day/month/year, e.g. 15/07/2026");
      return;
    }
    if (k === "worksSat") {   // Yes / No only now; "" is the unchosen placeholder
      vp.empModal.form.worksSat = el.value === "yes" ? true : el.value === "no" ? false : undefined;
      rerender(); return;
    }
    vp.empModal.form[k] = el.type === "checkbox" ? el.checked : el.value;
    if (k === "approver1" && !el.value) { vp.empModal.form.twoLevel = false; vp.empModal.form.approver2 = ""; } // auto-approve ⇒ no 2-level
    if (["joinDate", "twoLevel", "approver1", "approver2", "dept"].includes(k)) rerender(); // refresh pro-rate preview / dependent selects / new-team field
    return;
  }
  if (f.startsWith("off.") && vp.offModal) { vp.offModal[f.slice(4)] = el.value; return; }
  if (view === "apply" && vp.form) {
    if (f === "reason") { vp.form.reason = el.value; return; } // synced live via input; skipping re-render here keeps the submit click from being swallowed
    if (f === "attfile") {
      const file = el.files && el.files[0];
      vp.form._file = file || null;               // real File object, uploaded on submit
      vp.form.att = file ? file.name : "";
      rerender(); return;
    }
    if (f === "half") {
      const ds = el.dataset.d;
      if (!vp.form.half) vp.form.half = {};
      if (el.value) vp.form.half[ds] = el.value; else delete vp.form.half[ds];
      rerender(); return;
    }
    vp.form[f] = el.value;
    if (f === "start" && vp.form.end < vp.form.start) vp.form.end = vp.form.start;
    rerender();
  }
});
// <details> open state is lost on re-render; remember the Teams panel's state
document.addEventListener("toggle", ev => {
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-teams")) vp.teamsOpen = ev.target.open;
}, true);

document.addEventListener("input", ev => {
  const el = ev.target;
  if (view === "apply" && vp.form && el.dataset.f === "reason") vp.form.reason = el.value;
  const f = el.dataset.f || "";
  const liveSearch = { empSearch: "empsearch", recSearch: "recsearch", calSearch: "calsearch", ledSearch: "ledsearch" };
  if (liveSearch[f]) {
    // Live filter. TWO things must survive the re-render, and only one of them used to:
    //   · scroll position — render() resets it to 0 by design, so every keystroke threw
    //     the page back to the top. rerender() is the helper that keeps it. Filtering a
    //     list is not navigation; only changing page/tab should scroll to the top.
    //   · the caret — restored explicitly below rather than by render()'s own focus
    //     logic, because focusKey() keys off data-act and these inputs carry data-f.
    // Keep the real caret offsets: forcing it to value.length sent the cursor to the
    // end whenever someone edited the middle of what they had typed.
    const at = el.selectionStart, to = el.selectionEnd;
    vp[f] = el.value; rerender();
    const s = document.getElementById(liveSearch[f]);
    // preventScroll matters as much as rerender() here: a bare focus() scrolls the input
    // back into view, which undoes the scroll we just restored. render() already uses the same
    // flag for the control it re-focuses (see its focus-restore block).
    if (s) { s.focus({ preventScroll: true }); try { s.setSelectionRange(at, to); } catch (e) { /* type=search may refuse */ } }
    return;
  }
  // Sync modal text fields live so the save click (which blurs the field) never loses input
  if (vp.empModal && f.startsWith("em.") && el.type !== "checkbox") {
    vp.empModal.form[f.slice(3)] = el.value;
    // The joining-leave callout is computed from these two. Without a re-render it
    // kept showing the figure from when the modal opened — telling HR "6 days" while
    // the database correctly granted 6.5. A screen that disagrees with the data is
    // worse than a visible error. rerender() keeps the caret where it is.
    if (f === "em.annualBase" || f === "em.joinDMY" || f === "em.joinDate") rerender();
    const emDomain = ((db.org || {}).emailDomain || "").trim();
    if (f === "em.email") vp.empModal.emailTouched = true;
    // On Add the address is assembled from an editable prefix and the company domain, so
    // the domain can never be typed wrong. The stored form.email stays the full address —
    // everything downstream (validation, duplicate check, save) still reads that one field.
    if (f === "em.emailPrefix") {
      vp.empModal.emailTouched = true;
      // Clean as they type, and write it back, so the box always shows what will be saved.
      // Dots and hyphens stay — jian.wei is a perfectly ordinary address; spaces and the
      // rest go, because they only surface later as "Please enter a valid email" pointing
      // at a field that no longer contains one.
      const at = el.selectionStart;
      const pre = el.value.toLowerCase().replace(/[^a-z0-9._-]/g, "");
      if (el.value !== pre) {
        el.value = pre;
        try { el.setSelectionRange(Math.max(0, at - 1), Math.max(0, at - 1)); } catch (e) { /* ignore */ }
      }
      vp.empModal.form.emailPrefix = pre;
      vp.empModal.form.email = pre && emDomain ? pre + "@" + emDomain : "";
    }
    if (f === "em.name" && vp.empModal.mode === "add" && !vp.empModal.emailTouched) {
      // Auto-suggest from the name (ASCII only — Chinese names are typed manually)
      const slug = el.value.toLowerCase().replace(/[^a-z0-9]/g, "");
      vp.empModal.form.emailPrefix = slug;
      vp.empModal.form.email = slug && emDomain ? slug + "@" + emDomain : "";
      const pi = document.querySelector('input[data-f="em.emailPrefix"]');
      if (pi) pi.value = slug;
      const em = document.querySelector('input[data-f="em.email"]');
      if (em) em.value = vp.empModal.form.email;
    }
  }
  // The preview has to track what is typed, so this re-renders on every keystroke.
  // rerender() keeps the modal's scroll and the caret (see render()).
  if (vp.phBulk && f === "phb.text") { vp.phBulk.text = el.value; rerender(); return; }
  if (vp.offModal && f.startsWith("off.") && el.type !== "radio") vp.offModal[f.slice(4)] = el.value;
});

/* ============ Boot ============ */
function bootScreen() {
  $app().innerHTML = `<div class="login"><div class="loginbox"><h1>LeaveDesk</h1><p class="tag">Loading…</p></div></div>`;
}
async function boot() {
  bootScreen();
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { await afterAuth(); return; }
  } catch (e) { /* offline / first load — fall through to the sign-in page */ }
  me = null; render();
}
if (typeof supabase === "undefined") {
  document.getElementById("app").innerHTML = '<div class="login"><div class="loginbox"><h1>LeaveDesk</h1><p class="tag">Could not load a required library. Check your internet connection and refresh.</p></div></div>';
} else {
  boot();
}
</script>
</body>
</html>
