# Keeps the free-tier Supabase project awake — v2, WRITE-based.
#
# WHY THIS WAS REWRITTEN (2026-08 incident)
#   v1 pinged with a read (`select now()`), every 2 days, and every single ping
#   returned HTTP 200 — 13, 15, 17, 19 and 21 July all succeeded. The project
#   was paused anyway, some time between 21 and 23 July, and the HR system was
#   down for ~2 weeks (23 Jul → 5 Aug).
#   Supabase support only restated the rule: "paused after 7 days of inactivity".
#   Conclusion: a successful READ does not reset Supabase's inactivity timer.
#
#   v2 therefore performs a real WRITE on every ping (updates a single-row
#   heartbeat table). A write generates WAL and changes database state, which is
#   a far stronger "activity" signal than a read.
#
#   HONEST CAVEAT: Supabase does not document what counts as activity. A write is
#   the best available inference, NOT a guarantee. The only guaranteed fix is Pro
#   (US$25/mo). If the project pauses again despite this, stop patching — upgrade.
#
# SETUP REQUIRED — run this once, or every run will fail on purpose:
#   Supabase Dashboard → SQL Editor → paste and run:
#     hr-leave-system/supabase/keepalive_ping_v2.sql
#
# TWO THINGS THIS FILE DEPENDS ON:
#   1. It must live at .github/workflows/keepalive.yml (this exact path).
#   2. Scheduled workflows ONLY run from the repository's DEFAULT branch.
#      Merging this to a feature branch alone changes nothing.
#
# ALSO: GitHub disables scheduled workflows in a repo with no commit activity
# for 60 days. If this repo goes quiet, re-enable it from the Actions tab.
#
# The key below is the PUBLIC anon key (already visible in the website source).
# It grants nothing on its own — all access is enforced by database RLS.

name: Keep Supabase awake

on:
  schedule:
    # Daily at 01:17 UTC (09:17 SGT). Daily (not every 2 days) leaves margin
    # because GitHub's scheduled runs are best-effort and can be delayed.
    # The odd minute avoids the on-the-hour queue when runs are most often dropped.
    - cron: "17 1 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write        # needed to raise an alert issue when the ping fails

# Never let a manual run and the scheduled run overlap.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (write heartbeat)
        env:
          SUPABASE_URL: https://aypyolzkdupkpefpxius.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cHlvbHprZHVwa3BlZnB4aXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MDM0MTMsImV4cCI6MjA5OTA3OTQxM30.hoRS_j8yBTJkcQBG_IZRuVgDD06ZGCRam8lqz923f6s
        run: |
          set -uo pipefail

          ping() {
            # $1 = output file. Echoes the HTTP status code.
            curl -sS -o "$1" -w '%{http_code}' \
              -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo "000"
          }

          code1=$(ping /tmp/ping1.txt)
          n1=$(tr -d '"' < /tmp/ping1.txt)
          echo "ping 1 -> HTTP $code1 : $n1"

          if [ "$code1" != "200" ]; then
            # Diagnose: is the whole project down, or just the function missing?
            rest=$(curl -sS -o /tmp/rest.txt -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/leave_types?select=code&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" 2>/dev/null || echo "000")
            echo "diagnostic REST read -> HTTP $rest"
            cat /tmp/rest.txt 2>/dev/null; echo

            if [ "$rest" = "200" ]; then
              echo "::error::keepalive_ping() is missing or erroring (HTTP $code1), though the database is reachable. Run hr-leave-system/supabase/keepalive_ping_v2.sql in the Supabase SQL Editor. NOTE: a plain read does NOT keep the project awake, so this is NOT a safe state."
            else
              echo "::error::Supabase is unreachable (rpc HTTP $code1, rest HTTP $rest). The project is probably PAUSED — open the Supabase dashboard and restore it. Free projects are permanently deleted 90 days after pausing."
            fi
            exit 1
          fi

          # v2 returns a PERSISTED counter, so two calls must return N and N+1.
          # Do not check timestamps here: the old read-only v1 returned now(),
          # and two separate HTTP calls are two separate transactions, so its
          # timestamps differ too — that would prove nothing. Only a counter
          # that survives between requests proves a write actually landed.
          if ! [ "$n1" -eq "$n1" ] 2>/dev/null; then
            echo "::error::keepalive_ping() returned '$n1', which is not a number. That is the OLD read-only v1 function (it returned a timestamp), so this workflow is NOT keeping the project awake. Run hr-leave-system/supabase/keepalive_ping_v2.sql in the Supabase SQL Editor."
            exit 1
          fi

          code2=$(ping /tmp/ping2.txt)
          n2=$(tr -d '"' < /tmp/ping2.txt)
          echo "ping 2 -> HTTP $code2 : $n2"

          if [ "$code2" != "200" ]; then
            echo "::error::Second ping failed (HTTP $code2) after the first succeeded. Treating as unhealthy."
            exit 1
          fi

          # "Advanced" rather than "exactly +1": a manual run overlapping the cron
          # would bump the counter too, and a false alarm here is not harmless —
          # alert fatigue is part of why the July outage went unnoticed for weeks.
          # Any advance still proves the write persisted between two requests.
          if ! [ "$n2" -gt "$n1" ] 2>/dev/null; then
            echo "::error::Heartbeat counter did not advance ($n1 -> $n2). The write is not persisting, so the project is NOT being kept awake. Inspect public.keepalive_heartbeat in the Supabase SQL Editor."
            exit 1
          fi

          echo "Heartbeat counter advanced $n1 -> $n2. The write persisted; database is awake."

      # Covers a failure mode the alert issue below cannot: if this workflow stops
      # running AT ALL (GitHub disables cron in repos idle for 60 days, or someone
      # disables the Action), nothing fails, so no issue is ever raised and the
      # silence looks exactly like success. An external watchdog notices the
      # missing check-in instead. Optional — skipped when no secret is set.
      # To enable: create a check at healthchecks.io (free), then add its ping URL
      # as a repository secret named HEALTHCHECK_URL.
      - name: Watchdog check-in (only if a HEALTHCHECK_URL secret is set)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "${HC_URL:-}" ]; then
            curl -fsS --retry 3 "$HC_URL" > /dev/null && echo "Watchdog checked in"
          else
            echo "No HEALTHCHECK_URL secret set — skipping watchdog."
            echo "Without it, a workflow that stops running entirely will not alert anyone."
          fi

      - name: Raise an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="Supabase keep-alive FAILED"

          # Reuse the open issue if there is one, so a long outage does not open
          # a brand-new issue every single day.
          existing=$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"$MARKER\"))] | .[0].number // empty")

          body=$(cat <<EOF
          The daily Supabase keep-alive check failed.

          **Run log:** $RUN_URL

          The HR leave system (LeaveDesk) may be **down right now** — staff will not
          be able to apply for or approve leave.

          **What to do**
          1. Open the Supabase dashboard for project \`aypyolzkdupkpefpxius\`.
          2. If it says *Paused*, click **Restore**. It takes a few minutes.
          3. Check the run log above for which check failed and why.

          Free-tier projects are **permanently deleted 90 days** after they pause.
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Commented on existing alert issue #$existing"
          else
            gh issue create \
              --title "🚨 $MARKER — LeaveDesk may be down" \
              --body "$body"
            echo "Opened a new alert issue"
          fi
